<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -5 710 530" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="sync" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#000000"/>
    </marker>
    <marker id="ret" markerWidth="16" markerHeight="14" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#000000" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="520" fill="#ffffff"/>

  <!-- diagram frame + tab -->
  <rect x="15" y="15" width="670" height="490" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <path d="M15,15 H150 V31 L142,39 H15 Z" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="23" y="31" font-weight="bold">sd  Take Medication</text>

  <!-- actor -->
  <circle cx="110" cy="59" r="8" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <line x1="110" y1="67" x2="110" y2="93" stroke="#000000" stroke-width="1.4"/>
  <line x1="93" y1="75" x2="127" y2="75" stroke="#000000" stroke-width="1.4"/>
  <line x1="110" y1="93" x2="97" y2="117" stroke="#000000" stroke-width="1.4"/>
  <line x1="110" y1="93" x2="123" y2="117" stroke="#000000" stroke-width="1.4"/>
  <text x="110" y="133" text-anchor="middle" font-weight="bold">Patient</text>
  <line x1="110" y1="152" x2="110" y2="495" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- system -->
  <rect x="505" y="86" width="120" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="565" y="111" text-anchor="middle" font-weight="bold">:System</text>
  <line x1="565" y1="126" x2="565" y2="495" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- m1 call -->
  <text x="335" y="195" text-anchor="middle">viewTodaysMedications(patientId)</text>
  <line x1="110" y1="200" x2="560" y2="200" stroke="#000000" stroke-width="1.4" marker-end="url(#sync)"/>
  <rect x="560" y="200" width="9" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <!-- m2 return -->
  <text x="335" y="235" text-anchor="middle" font-style="italic">medicationList</text>
  <line x1="560" y1="240" x2="110" y2="240" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ret)"/>

  <!-- loop frame -->
  <rect x="78" y="272" width="545" height="118" fill="none" stroke="#000000" stroke-width="1.4"/>
  <path d="M78,272 H120 V284 L114,290 H78 Z" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="84" y="285" font-size="11" font-weight="bold">loop</text>
  <text x="126" y="285" font-size="11">[for each due dose]</text>

  <!-- m3 call -->
  <text x="335" y="320" text-anchor="middle">markMedicationTaken(medId)</text>
  <line x1="110" y1="325" x2="560" y2="325" stroke="#000000" stroke-width="1.4" marker-end="url(#sync)"/>
  <rect x="560" y="325" width="9" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <!-- m4 return -->
  <text x="335" y="360" text-anchor="middle" font-style="italic">confirmation</text>
  <line x1="560" y1="365" x2="110" y2="365" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ret)"/>
</svg>

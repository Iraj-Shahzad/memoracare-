<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 35 1250 671" font-family="Helvetica, Arial, sans-serif">
  <rect x="20" y="35" width="1250" height="671" fill="#ffffff"/>

  <!-- Relationship connector lines (center-to-center, clipped to nearest box edges) -->
  <g fill="none" stroke="#000000" stroke-width="1.3">
    <line x1="352.6" y1="249.0" x2="520.0" y2="322.8"/>   <!-- CaresFor care-pat -->
    <line x1="680.0" y1="340.5" x2="840.0" y2="305.5"/>   <!-- Takes pat-med -->
    <line x1="1000.0" y1="288.0" x2="1090.0" y2="288.0"/> <!-- Records med-medlog -->
    <line x1="680.0" y1="376.8" x2="860.0" y2="419.2"/>   <!-- Follows pat-rout -->
    <line x1="1020.0" y1="445.0" x2="1090.0" y2="451.0"/> <!-- Records rout-routlog -->
    <line x1="656.2" y1="396.0" x2="883.8" y2="550.0"/>   <!-- Triggers pat-alert -->
    <line x1="616.9" y1="396.0" x2="703.1" y2="590.0"/>   <!-- Has pat-rem -->
    <line x1="588.2" y1="396.0" x2="521.8" y2="610.0"/>   <!-- SummarizedIn pat-rep -->
    <line x1="580.3" y1="396.0" x2="479.7" y2="590.0"/>   <!-- Sends pat-chat -->
    <line x1="538.5" y1="396.0" x2="321.5" y2="530.0"/>   <!-- Owns pat-mem -->
    <line x1="520.0" y1="353.0" x2="200.0" y2="333.0"/>   <!-- Knows pat-face -->
    <line x1="520.0" y1="378.0" x2="200.0" y2="458.0"/>   <!-- Has pat-reclog -->
    <line x1="120.0" y1="440.0" x2="120.0" y2="366.0"/>   <!-- Matches reclog-face -->
    <line x1="520.0" y1="375.5" x2="400.0" y2="401.6"/>   <!-- About pat-note -->
    <line x1="287.2" y1="249.0" x2="316.5" y2="380.0"/>   <!-- Writes care-note -->
    <line x1="680.0" y1="148.1" x2="860.0" y2="109.9"/>   <!-- Handles user-contact -->

    <!-- Specialization (generalization) lines -->
    <line x1="600.0" y1="210.0" x2="600.0" y2="238.0"/>   <!-- User -> triangle apex -->
    <line x1="600.0" y1="264.0" x2="600.0" y2="320.0"/>   <!-- triangle -> Patient -->
    <line x1="590.0" y1="258.0" x2="360.0" y2="225.5"/>   <!-- triangle -> Caregiver -->
  </g>

  <!-- Specialization triangle (hollow, pointing north to superclass User) -->
  <polygon points="600,238 585,264 615,264" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="620" y="253" font-size="9" font-style="italic" fill="#000000">{Optional, Or}</text>

  <!-- ================= ENTITY BOXES ================= -->
  <!-- User -->
  <rect x="520" y="120" width="160" height="90" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="526" y="134" font-size="11" font-weight="bold" fill="#000000">User</text>
  <line x1="520" y1="140" x2="680" y2="140" stroke="#000000" stroke-width="1.3"/>
  <text x="526" y="154" font-size="11" fill="#000000">userId {PK}</text>
  <text x="526" y="168" font-size="11" fill="#000000">name</text>
  <text x="526" y="182" font-size="11" fill="#000000">email</text>
  <text x="526" y="196" font-size="11" fill="#000000">role</text>

  <!-- Patient -->
  <rect x="520" y="320" width="160" height="76" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="526" y="334" font-size="11" font-weight="bold" fill="#000000">Patient</text>
  <line x1="520" y1="340" x2="680" y2="340" stroke="#000000" stroke-width="1.3"/>
  <text x="526" y="354" font-size="11" fill="#000000">patientId {PK}</text>
  <text x="526" y="368" font-size="11" fill="#000000">diagnosis</text>
  <text x="526" y="382" font-size="11" fill="#000000">dateOfBirth</text>

  <!-- Caregiver -->
  <rect x="200" y="185" width="160" height="64" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>

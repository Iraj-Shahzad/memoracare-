  <line x1="1090" y1="270" x2="1250" y2="270" stroke="#000000" stroke-width="1.3"/>
  <text x="1096" y="284" font-size="11" fill="#000000">logId {PK}</text>
  <text x="1096" y="298" font-size="11" fill="#000000">status</text>
  <text x="1096" y="312" font-size="11" fill="#000000">scheduledTime</text>

  <!-- Routine -->
  <rect x="860" y="400" width="160" height="76" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="866" y="414" font-size="11" font-weight="bold" fill="#000000">Routine</text>
  <line x1="860" y1="420" x2="1020" y2="420" stroke="#000000" stroke-width="1.3"/>
  <text x="866" y="434" font-size="11" fill="#000000">routineId {PK}</text>
  <text x="866" y="448" font-size="11" fill="#000000">activityName</text>
  <text x="866" y="462" font-size="11" fill="#000000">startTime</text>


  <text x="866" y="598" font-size="11" fill="#000000">type</text>
  <text x="866" y="612" font-size="11" fill="#000000">severity</text>

  <!-- Reminder -->
  <rect x="640" y="590" width="160" height="76" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>

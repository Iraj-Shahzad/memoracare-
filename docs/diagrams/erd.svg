    <rect x="476.1" y="568.6" width="20" height="12" fill="#ffffff"/><text x="486.1" y="577.6">0..*</text>
    <!-- Owns -->
    <rect x="516.6" y="394.4" width="20" height="12" fill="#ffffff"/><text x="526.6" y="403.4">1..1</text>
    <rect x="323.4" y="513.6" width="20" height="12" fill="#ffffff"/><text x="333.4" y="522.6">0..*</text>
    <!-- Knows -->
    <rect x="496.0" y="343.1" width="20" height="12" fill="#ffffff"/><text x="506.0" y="352.1">1..1</text>
    <rect x="204.0" y="324.9" width="20" height="12" fill="#ffffff"/><text x="214.0" y="333.9">0..*</text>
    <!-- Has pat-reclog -->
    <rect x="496.4" y="372.4" width="20" height="12" fill="#ffffff"/><text x="506.4" y="381.4">1..1</text>
    <rect x="203.6" y="445.6" width="20" height="12" fill="#ffffff"/><text x="213.6" y="454.6">0..*</text>
    <!-- Matches reclog-face -->
    <rect x="110.0" y="420.0" width="20" height="12" fill="#ffffff"/><text x="120.0" y="429.0">0..*</text>
    <rect x="110.0" y="374.0" width="20" height="12" fill="#ffffff"/><text x="120.0" y="383.0">0..1</text>

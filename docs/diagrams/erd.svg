  <rect x="1090" y="420" width="160" height="76" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="1096" y="434" font-size="11" font-weight="bold" fill="#000000">RoutineLog</text>
  <line x1="1090" y1="440" x2="1250" y2="440" stroke="#000000" stroke-width="1.3"/>
  <text x="1096" y="454" font-size="11" fill="#000000">logId {PK}</text>
  <text x="1096" y="468" font-size="11" fill="#000000">status</text>

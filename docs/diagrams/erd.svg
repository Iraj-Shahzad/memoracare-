<svg viewBox="0 0 1720 760" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1720" height="760" fill="#ffffff"/>
  <text x="40" y="30" font-size="19" font-weight="700">MemoryCare — Entity Relationship Diagram (UML notation)</text>

  <!-- ===== relationship lines ===== -->
  <g stroke="#555" stroke-width="1.2" fill="none">
    <!-- fan from Patient (840,326) -->
    <line x1="840" y1="326" x2="115" y2="470"/>
    <line x1="840" y1="326" x2="275" y2="470"/>
    <line x1="840" y1="326" x2="435" y2="470"/>
    <line x1="840" y1="326" x2="595" y2="470"/>
    <line x1="840" y1="326" x2="755" y2="470"/>
    <line x1="840" y1="326" x2="915" y2="470"/>
    <line x1="840" y1="326" x2="1075" y2="470"/>
    <line x1="840" y1="326" x2="1235" y2="470"/>
    <line x1="840" y1="326" x2="1395" y2="470"/>
    <line x1="840" y1="326" x2="1565" y2="470"/>
    <!-- chains + others -->
    <line x1="1395" y1="546" x2="1395" y2="650"/>
    <line x1="1565" y1="546" x2="1565" y2="650"/>
    <polyline points="915,546 835,572 755,546"/>
    <line x1="460" y1="282" x2="760" y2="288"/>
    <line x1="380" y1="314" x2="115" y2="470"/>
    <line x1="920" y1="85" x2="1150" y2="88"/>
  </g>

  <!-- ===== specialization (hollow triangle to superclass) ===== -->
  <g stroke="#000" stroke-width="1.3" fill="none">
    <line x1="840" y1="130" x2="840" y2="164"/>
    <line x1="840" y1="192" x2="840" y2="250"/>
    <line x1="840" y1="215" x2="380" y2="215"/>
    <line x1="380" y1="215" x2="380" y2="250"/>
  </g>
  <path d="M824,192 L856,192 L840,164 Z" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <text x="866" y="185" font-size="9" font-style="italic">{Optional, Or}</text>

  <!-- ===== entities ===== -->
  <g font-size="11">
    <!-- User -->
    <rect x="760" y="40" width="160" height="90" fill="#fff" stroke="#000"/><text x="840" y="56" text-anchor="middle" font-weight="700">User</text><line x1="760" y1="63" x2="920" y2="63" stroke="#000"/>
    <text x="768" y="79">userId {PK}</text><text x="768" y="94">name</text><text x="768" y="109">email</text><text x="768" y="124">role</text>
    <!-- Patient -->
    <rect x="760" y="250" width="160" height="76" fill="#fff" stroke="#000"/><text x="840" y="266" text-anchor="middle" font-weight="700">Patient</text><line x1="760" y1="273" x2="920" y2="273" stroke="#000"/>
    <text x="768" y="289">patientId {PK}</text><text x="768" y="304">diagnosis</text><text x="768" y="319">dateOfBirth</text>
    <!-- Caregiver -->
    <rect x="300" y="250" width="160" height="64" fill="#fff" stroke="#000"/><text x="380" y="266" text-anchor="middle" font-weight="700">Caregiver</text><line x1="300" y1="273" x2="460" y2="273" stroke="#000"/>
    <text x="308" y="289">caregiverId {PK}</text><text x="308" y="304">specialization</text>
    <!-- Contact -->
    <rect x="1150" y="50" width="160" height="76" fill="#fff" stroke="#000"/><text x="1230" y="66" text-anchor="middle" font-weight="700">Contact</text><line x1="1150" y1="73" x2="1310" y2="73" stroke="#000"/>
    <text x="1158" y="89">contactId {PK}</text><text x="1158" y="104">subject</text><text x="1158" y="119">status</text>
    <!-- Fan row -->
    <rect x="40" y="470" width="150" height="76" fill="#fff" stroke="#000"/><text x="115" y="486" text-anchor="middle" font-weight="700">Note</text><line x1="40" y1="493" x2="190" y2="493" stroke="#000"/>
    <text x="48" y="509">noteId {PK}</text><text x="48" y="524">content</text><text x="48" y="539">category</text>
    <rect x="200" y="470" width="150" height="76" fill="#fff" stroke="#000"/><text x="275" y="486" text-anchor="middle" font-weight="700">Report</text><line x1="200" y1="493" x2="350" y2="493" stroke="#000"/>
    <text x="208" y="509">reportId {PK}</text><text x="208" y="524">type</text><text x="208" y="539">period</text>
    <rect x="360" y="470" width="150" height="76" fill="#fff" stroke="#000"/><text x="435" y="486" text-anchor="middle" font-weight="700">Memory</text><line x1="360" y1="493" x2="510" y2="493" stroke="#000"/>
    <text x="368" y="509">memoryId {PK}</text><text x="368" y="524">title</text><text x="368" y="539">date</text>
    <rect x="520" y="470" width="150" height="76" fill="#fff" stroke="#000"/><text x="595" y="486" text-anchor="middle" font-weight="700">ChatHistory</text><line x1="520" y1="493" x2="670" y2="493" stroke="#000"/>
    <text x="528" y="509">chatId {PK}</text><text x="528" y="524">query</text><text x="528" y="539">response</text>
    <rect x="680" y="470" width="150" height="76" fill="#fff" stroke="#000"/><text x="755" y="486" text-anchor="middle" font-weight="700">KnownFace</text><line x1="680" y1="493" x2="830" y2="493" stroke="#000"/>
    <text x="688" y="509">faceId {PK}</text><text x="688" y="524">name</text><text x="688" y="539">relationship</text>
    <rect x="840" y="470" width="150" height="76" fill="#fff" stroke="#000"/><text x="915" y="486" text-anchor="middle" font-weight="700" font-size="10">RecognitionLog</text><line x1="840" y1="493" x2="990" y2="493" stroke="#000"/>
    <text x="848" y="509">recId {PK}</text><text x="848" y="524">result</text><text x="848" y="539">confidence</text>
    <rect x="1000" y="470" width="150" height="76" fill="#fff" stroke="#000"/><text x="1075" y="486" text-anchor="middle" font-weight="700">Reminder</text><line x1="1000" y1="493" x2="1150" y2="493" stroke="#000"/>
    <text x="1008" y="509">reminderId {PK}</text><text x="1008" y="524">type</text><text x="1008" y="539">scheduledTime</text>
    <rect x="1160" y="470" width="150" height="76" fill="#fff" stroke="#000"/><text x="1235" y="486" text-anchor="middle" font-weight="700">Alert</text><line x1="1160" y1="493" x2="1310" y2="493" stroke="#000"/>
    <text x="1168" y="509">alertId {PK}</text><text x="1168" y="524">type</text><text x="1168" y="539">severity</text>
    <rect x="1320" y="470" width="150" height="76" fill="#fff" stroke="#000"/><text x="1395" y="486" text-anchor="middle" font-weight="700">Medication</text><line x1="1320" y1="493" x2="1470" y2="493" stroke="#000"/>
    <text x="1328" y="509">medicationId {PK}</text><text x="1328" y="524">name</text><text x="1328" y="539">dosage</text>
    <rect x="1490" y="470" width="150" height="76" fill="#fff" stroke="#000"/><text x="1565" y="486" text-anchor="middle" font-weight="700">Routine</text><line x1="1490" y1="493" x2="1640" y2="493" stroke="#000"/>
    <text x="1498" y="509">routineId {PK}</text><text x="1498" y="524">activityName</text><text x="1498" y="539">startTime</text>
    <!-- Chains -->
    <rect x="1320" y="650" width="150" height="76" fill="#fff" stroke="#000"/><text x="1395" y="666" text-anchor="middle" font-weight="700" font-size="10">MedicationLog</text><line x1="1320" y1="673" x2="1470" y2="673" stroke="#000"/>
    <text x="1328" y="689">logId {PK}</text><text x="1328" y="704">status</text><text x="1328" y="719">scheduledTime</text>
    <rect x="1490" y="650" width="150" height="76" fill="#fff" stroke="#000"/><text x="1565" y="666" text-anchor="middle" font-weight="700">RoutineLog</text><line x1="1490" y1="673" x2="1640" y2="673" stroke="#000"/>
    <text x="1498" y="689">logId {PK}</text><text x="1498" y="704">status</text><text x="1498" y="719">scheduledDate</text>
  </g>

  <!-- ===== relationship names ===== -->
  <g font-size="10" text-anchor="middle">
    <text x="477" y="396">About</text><text x="557" y="396">SummarizedIn</text><text x="637" y="396">Owns</text><text x="717" y="396">Sends</text>
    <text x="797" y="396">Knows</text><text x="877" y="396">Has</text><text x="957" y="396">Has</text><text x="1037" y="396">Triggers</text>
    <text x="1117" y="396">Takes</text><text x="1202" y="396">Follows</text>
    <text x="1395" y="600">Records</text><text x="1565" y="600">Records</text><text x="835" y="566">Matches</text>
    <text x="565" y="278">CaresFor</text><text x="250" y="390">Writes</text><text x="1035" y="80">Handles</text>
  </g>

  <!-- ===== multiplicities ===== -->
  <g font-size="9" text-anchor="middle">
    <!-- patient-side of fan (spread y=366) -->
    <text x="637" y="366">1..1</text><text x="682" y="366">0..1</text><text x="727" y="366">1..1</text><text x="771" y="366">1..1</text>
    <text x="816" y="366">1..1</text><text x="861" y="366">1..1</text><text x="906" y="366">1..1</text><text x="951" y="366">1..1</text>
    <text x="996" y="366">1..1</text><text x="1043" y="366">1..1</text>
    <!-- entity-side (above each box) -->
    <text x="115" y="462">0..*</text><text x="275" y="462">0..*</text><text x="435" y="462">0..*</text><text x="595" y="462">0..*</text>
    <text x="755" y="462">0..*</text><text x="915" y="462">0..*</text><text x="1075" y="462">0..*</text><text x="1235" y="462">0..*</text>
    <text x="1395" y="462">0..*</text><text x="1565" y="462">0..*</text>
    <!-- chains -->
    <text x="1410" y="558">1..1</text><text x="1410" y="642">0..*</text>
    <text x="1580" y="558">1..1</text><text x="1580" y="642">0..*</text>
    <!-- matches -->
    <text x="905" y="540">0..*</text><text x="765" y="540">0..1</text>
    <!-- caresfor -->
    <text x="472" y="278">0..*</text><text x="700" y="284">0..*</text>
    <!-- writes -->
    <text x="352" y="342">1..1</text><text x="150" y="458">0..*</text>
    <!-- handles -->
    <text x="948" y="80">0..1</text><text x="1120" y="82">0..*</text>
  </g>
</svg>

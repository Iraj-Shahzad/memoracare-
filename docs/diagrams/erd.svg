  <line x1="860" y1="75" x2="1020" y2="75" stroke="#000000" stroke-width="1.3"/>
  <text x="866" y="89" font-size="11" fill="#000000">contactId {PK}</text>
  <text x="866" y="103" font-size="11" fill="#000000">subject</text>
  <text x="866" y="117" font-size="11" fill="#000000">status</text>

  <!-- Medication -->
  <rect x="840" y="250" width="160" height="76" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>

  <text x="256" y="428" font-size="11" fill="#000000">content</text>
  <text x="256" y="442" font-size="11" fill="#000000">category</text>

  <!-- ================= RELATIONSHIP LABELS (names + multiplicities) ================= -->
  <g font-size="10" text-anchor="middle" fill="#000000">
    <rect x="410.3" y="276.9" width="52" height="13" fill="#ffffff"/><text x="436.3" y="285.9">CaresFor</text>
    <rect x="743.0" y="314.0" width="34" height="13" fill="#ffffff"/><text x="760.0" y="323.0">Takes</text>
    <rect x="1022.0" y="279.0" width="46" height="13" fill="#ffffff"/><text x="1045.0" y="288.0">Records</text>
    <rect x="747.0" y="389.0" width="46" height="13" fill="#ffffff"/><text x="770.0" y="398.0">Follows</text>
    <rect x="1032.0" y="439.0" width="46" height="13" fill="#ffffff"/><text x="1055.0" y="448.0">Records</text>
    <rect x="744.0" y="464.0" width="52" height="13" fill="#ffffff"/><text x="770.0" y="473.0">Triggers</text>
    <rect x="649.0" y="484.0" width="22" height="13" fill="#ffffff"/><text x="660.0" y="493.0">Has</text>
    <rect x="517.0" y="494.0" width="76" height="13" fill="#ffffff"/><text x="555.0" y="503.0">SummarizedIn</text>
    <rect x="513.0" y="484.0" width="34" height="13" fill="#ffffff"/><text x="530.0" y="493.0">Sends</text>
    <rect x="416.0" y="454.0" width="28" height="13" fill="#ffffff"/><text x="430.0" y="463.0">Owns</text>
    <rect x="343.0" y="334.0" width="34" height="13" fill="#ffffff"/><text x="360.0" y="343.0">Knows</text>
    <rect x="349.0" y="409.0" width="22" height="13" fill="#ffffff"/><text x="360.0" y="418.0">Has</text>
    <rect x="97.0" y="394.0" width="46" height="13" fill="#ffffff"/><text x="120.0" y="403.0">Matches</text>
    <rect x="443.0" y="379.5" width="34" height="13" fill="#ffffff"/><text x="460.0" y="388.5">About</text>
    <rect x="281.8" y="305.5" width="40" height="13" fill="#ffffff"/><text x="301.8" y="314.5">Writes</text>
    <rect x="747.0" y="120.0" width="46" height="13" fill="#ffffff"/><text x="770.0" y="129.0">Handles</text>
  </g>

  <g font-size="9" text-anchor="middle" fill="#000000">
    <!-- CaresFor -->
    <rect x="355.4" y="245.6" width="20" height="12" fill="#ffffff"/><text x="365.4" y="254.6">0..*</text>
    <rect x="497.2" y="308.2" width="20" height="12" fill="#ffffff"/><text x="507.2" y="317.2">0..*</text>
    <!-- Takes -->
    <rect x="683.7" y="328.5" width="20" height="12" fill="#ffffff"/><text x="693.7" y="337.5">1..1</text>
    <rect x="816.3" y="299.5" width="20" height="12" fill="#ffffff"/><text x="826.3" y="308.5">0..*</text>
    <!-- Records med-medlog -->
    <rect x="1004.0" y="279.0" width="20" height="12" fill="#ffffff"/><text x="1014.0" y="288.0">1..1</text>
    <rect x="1066.0" y="279.0" width="20" height="12" fill="#ffffff"/><text x="1076.0" y="288.0">0..*</text>
    <!-- Follows -->
    <rect x="683.6" y="371.0" width="20" height="12" fill="#ffffff"/><text x="693.6" y="380.0">1..1</text>
    <rect x="836.4" y="407.0" width="20" height="12" fill="#ffffff"/><text x="846.4" y="416.0">0..*</text>
    <!-- Records rout-routlog -->
    <rect x="1023.9" y="437.2" width="20" height="12" fill="#ffffff"/><text x="1033.9" y="446.2">1..1</text>
    <rect x="1066.1" y="440.8" width="20" height="12" fill="#ffffff"/><text x="1076.1" y="449.8">0..*</text>
    <!-- Triggers -->
    <rect x="657.8" y="394.8" width="20" height="12" fill="#ffffff"/><text x="667.8" y="403.8">1..1</text>
    <rect x="862.2" y="533.2" width="20" height="12" fill="#ffffff"/><text x="872.2" y="542.2">0..*</text>
    <!-- Has pat-rem -->
    <rect x="612.6" y="399.8" width="20" height="12" fill="#ffffff"/><text x="622.6" y="408.8">1..1</text>
    <rect x="687.4" y="568.2" width="20" height="12" fill="#ffffff"/><text x="697.4" y="577.2">0..*</text>

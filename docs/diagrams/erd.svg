<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 35 1250 845" font-family="Helvetica, Arial, sans-serif">
  <rect x="20" y="35" width="1250" height="845" fill="#ffffff"/>

  <!-- Relationship connector lines (center-to-center, clipped to the box edges) -->
  <g fill="none" stroke="#000000" stroke-width="1.3">
    <line x1="352.6" y1="249.0" x2="520.0" y2="322.8"/>   <!-- CaresFor care-pat -->
    <line x1="680.0" y1="340.5" x2="840.0" y2="305.5"/>   <!-- Takes pat-med -->
    <line x1="1000.0" y1="288.0" x2="1090.0" y2="288.0"/>   <!-- Records med-medlog -->
    <line x1="680.0" y1="376.8" x2="860.0" y2="419.2"/>   <!-- Follows pat-rout -->
    <line x1="1020.0" y1="445.0" x2="1090.0" y2="451.0"/>   <!-- Records rout-routlog -->
    <line x1="656.2" y1="396.0" x2="883.8" y2="550.0"/>   <!-- Triggers pat-alert -->
    <line x1="616.9" y1="396.0" x2="703.1" y2="590.0"/>   <!-- Has pat-rem -->
    <line x1="602.0" y1="396.0" x2="618.0" y2="700.0"/>   <!-- SummarizedIn pat-rep -->
    <line x1="587.3" y1="396.0" x2="522.7" y2="590.0"/>   <!-- Sends pat-chat -->
    <line x1="569.2" y1="396.0" x2="290.8" y2="740.0"/>   <!-- Owns pat-mem -->
    <line x1="520.0" y1="353.0" x2="200.0" y2="333.0"/>   <!-- Knows pat-face -->
    <line x1="520.0" y1="378.0" x2="200.0" y2="458.0"/>   <!-- Has pat-reclog -->
    <line x1="120.0" y1="440.0" x2="120.0" y2="366.0"/>   <!-- Matches reclog-face -->
    <line x1="545.0" y1="396.0" x2="380.0" y2="510.0"/>   <!-- About pat-note -->
    <line x1="284.4" y1="249.0" x2="319.8" y2="510.0"/>   <!-- Writes care-note -->
    <line x1="680.0" y1="148.1" x2="860.0" y2="109.9"/>   <!-- Handles user-contact -->

    <!-- Orthogonal connectors for the two relationships that cannot run straight -->
    <polyline points="520,165 415,165 415,738 540,738" fill="none"/>   <!-- GeneratedBy user-rep -->
    <polyline points="220,249 220,495 940,495 940,550" fill="none"/>   <!-- Receives care-alert -->

    <!-- Specialization (generalization) lines -->
    <line x1="600.0" y1="210.0" x2="600.0" y2="238.0"/>   <!-- User -> triangle apex -->
    <line x1="600.0" y1="264.0" x2="600.0" y2="320.0"/>   <!-- triangle -> Patient -->
    <line x1="590.0" y1="258.0" x2="360.0" y2="225.5"/>   <!-- triangle -> Caregiver -->
  </g>

  <!-- Specialization triangle (hollow, pointing north to superclass User) -->
  <polygon points="600,238 585,264 615,264" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="620" y="253" font-size="9" font-style="italic" fill="#000000">{Optional, Or}</text>

  <!-- ================= ENTITY BOXES ================= -->
  <!-- User -->
  <rect x="520" y="120" width="160" height="90" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="526" y="134" font-size="11" font-weight="bold" fill="#000000">User</text>
  <line x1="520" y1="140" x2="680" y2="140" stroke="#000000" stroke-width="1.3"/>
  <text x="526" y="154" font-size="11" fill="#000000">userId {PK}</text>
  <text x="526" y="168" font-size="11" fill="#000000">name</text>
  <text x="526" y="182" font-size="11" fill="#000000">email</text>
  <text x="526" y="196" font-size="11" fill="#000000">role</text>

  <!-- Patient -->
  <rect x="520" y="320" width="160" height="76" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="526" y="334" font-size="11" font-weight="bold" fill="#000000">Patient</text>
  <line x1="520" y1="340" x2="680" y2="340" stroke="#000000" stroke-width="1.3"/>
  <text x="526" y="354" font-size="11" fill="#000000">patientId {PK}</text>
  <text x="526" y="368" font-size="11" fill="#000000">diagnosis</text>
  <text x="526" y="382" font-size="11" fill="#000000">dateOfBirth</text>

  <!-- Caregiver -->
  <rect x="200" y="185" width="160" height="64" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="206" y="199" font-size="11" font-weight="bold" fill="#000000">Caregiver</text>
  <line x1="200" y1="205" x2="360" y2="205" stroke="#000000" stroke-width="1.3"/>
  <text x="206" y="219" font-size="11" fill="#000000">caregiverId {PK}</text>
  <text x="206" y="233" font-size="11" fill="#000000">specialization</text>

  <!-- Contact -->
  <rect x="860" y="55" width="160" height="76" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="866" y="69" font-size="11" font-weight="bold" fill="#000000">Contact</text>
  <line x1="860" y1="75" x2="1020" y2="75" stroke="#000000" stroke-width="1.3"/>
  <text x="866" y="89" font-size="11" fill="#000000">contactId {PK}</text>
  <text x="866" y="103" font-size="11" fill="#000000">subject</text>
  <text x="866" y="117" font-size="11" fill="#000000">status</text>

  <!-- Medication -->
  <rect x="840" y="250" width="160" height="76" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="846" y="264" font-size="11" font-weight="bold" fill="#000000">Medication</text>
  <line x1="840" y1="270" x2="1000" y2="270" stroke="#000000" stroke-width="1.3"/>
  <text x="846" y="284" font-size="11" fill="#000000">medicationId {PK}</text>
  <text x="846" y="298" font-size="11" fill="#000000">name</text>
  <text x="846" y="312" font-size="11" fill="#000000">dosage</text>

  <!-- MedicationLog -->
  <rect x="1090" y="250" width="160" height="76" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="1096" y="264" font-size="11" font-weight="bold" fill="#000000">MedicationLog</text>
  <line x1="1090" y1="270" x2="1250" y2="270" stroke="#000000" stroke-width="1.3"/>
  <text x="1096" y="284" font-size="11" fill="#000000">logId {PK}</text>
  <text x="1096" y="298" font-size="11" fill="#000000">status</text>
  <text x="1096" y="312" font-size="11" fill="#000000">scheduledTime</text>

  <!-- Routine -->
  <rect x="860" y="400" width="160" height="76" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="866" y="414" font-size="11" font-weight="bold" fill="#000000">Routine</text>
  <line x1="860" y1="420" x2="1020" y2="420" stroke="#000000" stroke-width="1.3"/>
  <text x="866" y="434" font-size="11" fill="#000000">routineId {PK}</text>
  <text x="866" y="448" font-size="11" fill="#000000">activityName</text>
  <text x="866" y="462" font-size="11" fill="#000000">startTime</text>

  <!-- RoutineLog -->
  <rect x="1090" y="420" width="160" height="76" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="1096" y="434" font-size="11" font-weight="bold" fill="#000000">RoutineLog</text>
  <line x1="1090" y1="440" x2="1250" y2="440" stroke="#000000" stroke-width="1.3"/>
  <text x="1096" y="454" font-size="11" fill="#000000">logId {PK}</text>
  <text x="1096" y="468" font-size="11" fill="#000000">status</text>
  <text x="1096" y="482" font-size="11" fill="#000000">scheduledDate</text>

  <!-- Alert -->
  <rect x="860" y="550" width="160" height="76" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="866" y="564" font-size="11" font-weight="bold" fill="#000000">Alert</text>
  <line x1="860" y1="570" x2="1020" y2="570" stroke="#000000" stroke-width="1.3"/>
  <text x="866" y="584" font-size="11" fill="#000000">alertId {PK}</text>
  <text x="866" y="598" font-size="11" fill="#000000">type</text>
  <text x="866" y="612" font-size="11" fill="#000000">severity</text>

  <!-- Reminder -->
  <rect x="640" y="590" width="160" height="76" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="646" y="604" font-size="11" font-weight="bold" fill="#000000">Reminder</text>
  <line x1="640" y1="610" x2="800" y2="610" stroke="#000000" stroke-width="1.3"/>
  <text x="646" y="624" font-size="11" fill="#000000">reminderId {PK}</text>
  <text x="646" y="638" font-size="11" fill="#000000">type</text>
  <text x="646" y="652" font-size="11" fill="#000000">scheduledTime</text>

  <!-- Report -->
  <rect x="540" y="700" width="160" height="76" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="546" y="714" font-size="11" font-weight="bold" fill="#000000">Report</text>
  <line x1="540" y1="720" x2="700" y2="720" stroke="#000000" stroke-width="1.3"/>
  <text x="546" y="734" font-size="11" fill="#000000">reportId {PK}</text>
  <text x="546" y="748" font-size="11" fill="#000000">type</text>
  <text x="546" y="762" font-size="11" fill="#000000">period</text>

  <!-- ChatHistory -->
  <rect x="430" y="590" width="160" height="76" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="436" y="604" font-size="11" font-weight="bold" fill="#000000">ChatHistory</text>
  <line x1="430" y1="610" x2="590" y2="610" stroke="#000000" stroke-width="1.3"/>
  <text x="436" y="624" font-size="11" fill="#000000">chatId {PK}</text>
  <text x="436" y="638" font-size="11" fill="#000000">query</text>
  <text x="436" y="652" font-size="11" fill="#000000">response</text>

  <!-- Memory -->
  <rect x="180" y="740" width="160" height="76" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="186" y="754" font-size="11" font-weight="bold" fill="#000000">Memory</text>
  <line x1="180" y1="760" x2="340" y2="760" stroke="#000000" stroke-width="1.3"/>
  <text x="186" y="774" font-size="11" fill="#000000">memoryId {PK}</text>
  <text x="186" y="788" font-size="11" fill="#000000">title</text>
  <text x="186" y="802" font-size="11" fill="#000000">date</text>

  <!-- KnownFace -->
  <rect x="40" y="290" width="160" height="76" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="46" y="304" font-size="11" font-weight="bold" fill="#000000">KnownFace</text>
  <line x1="40" y1="310" x2="200" y2="310" stroke="#000000" stroke-width="1.3"/>
  <text x="46" y="324" font-size="11" fill="#000000">faceId {PK}</text>
  <text x="46" y="338" font-size="11" fill="#000000">name</text>
  <text x="46" y="352" font-size="11" fill="#000000">relationship</text>

  <!-- RecognitionLog -->
  <rect x="40" y="440" width="160" height="76" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="46" y="454" font-size="11" font-weight="bold" fill="#000000">RecognitionLog</text>
  <line x1="40" y1="460" x2="200" y2="460" stroke="#000000" stroke-width="1.3"/>
  <text x="46" y="474" font-size="11" fill="#000000">recId {PK}</text>
  <text x="46" y="488" font-size="11" fill="#000000">result</text>
  <text x="46" y="502" font-size="11" fill="#000000">confidence</text>

  <!-- Note -->
  <rect x="250" y="510" width="150" height="76" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
  <text x="256" y="524" font-size="11" font-weight="bold" fill="#000000">Note</text>
  <line x1="250" y1="530" x2="400" y2="530" stroke="#000000" stroke-width="1.3"/>
  <text x="256" y="544" font-size="11" fill="#000000">noteId {PK}</text>
  <text x="256" y="558" font-size="11" fill="#000000">content</text>
  <text x="256" y="572" font-size="11" fill="#000000">category</text>

  <!-- ================= RELATIONSHIP NAMES ================= -->
  <g font-size="10" text-anchor="middle" fill="#000000">
    <rect x="409.3" y="276.4" width="54" height="13" fill="#ffffff"/><text x="436.3" y="286.4">CaresFor</text>
    <rect x="742.0" y="313.5" width="36" height="13" fill="#ffffff"/><text x="760.0" y="323.5">Takes</text>
    <rect x="1021.0" y="258.5" width="48" height="13" fill="#ffffff"/><text x="1045.0" y="268.5">Records</text>
    <rect x="746.0" y="388.5" width="48" height="13" fill="#ffffff"/><text x="770.0" y="398.5">Follows</text>
    <rect x="1032.7" y="418.6" width="48" height="13" fill="#ffffff"/><text x="1056.7" y="428.6">Records</text>
    <rect x="743.0" y="463.5" width="54" height="13" fill="#ffffff"/><text x="770.0" y="473.5">Triggers</text>
    <rect x="635.1" y="454.4" width="24" height="13" fill="#ffffff"/><text x="647.1" y="464.4">Has</text>
    <rect x="571.0" y="538.5" width="78" height="13" fill="#ffffff"/><text x="610.0" y="548.5">SummarizedIn</text>
    <rect x="527.3" y="512.6" width="36" height="13" fill="#ffffff"/><text x="545.3" y="522.6">Sends</text>
    <rect x="456.8" y="506.9" width="30" height="13" fill="#ffffff"/><text x="471.8" y="516.9">Owns</text>
    <rect x="342.0" y="333.5" width="36" height="13" fill="#ffffff"/><text x="360.0" y="343.5">Knows</text>
    <rect x="348.0" y="408.5" width="24" height="13" fill="#ffffff"/><text x="360.0" y="418.5">Has</text>
    <rect x="134.0" y="393.5" width="48" height="13" fill="#ffffff"/><text x="158.0" y="403.5">Matches</text>
    <rect x="444.5" y="443.5" width="36" height="13" fill="#ffffff"/><text x="462.5" y="453.5">About</text>
    <rect x="281.1" y="370.0" width="42" height="13" fill="#ffffff"/><text x="302.1" y="380.0">Writes</text>
    <rect x="746.0" y="119.5" width="48" height="13" fill="#ffffff"/><text x="770.0" y="129.5">Handles</text>
    <rect x="379.0" y="290.5" width="72" height="13" fill="#ffffff"/><text x="415.0" y="300.5">GeneratedBy</text>
    <rect x="673.0" y="485.5" width="54" height="13" fill="#ffffff"/><text x="700.0" y="495.5">Receives</text>
  </g>

  <!-- ================= MULTIPLICITIES (min..max at both ends) ================= -->
  <g font-size="9" text-anchor="middle" fill="#000000">
    <!-- CaresFor -->
    <rect x="362.8" y="248.9" width="20" height="12" fill="#ffffff"/><text x="372.8" y="258.4">0..*</text>
    <rect x="489.9" y="304.9" width="20" height="12" fill="#ffffff"/><text x="499.9" y="314.4">0..*</text>
    <!-- Takes -->
    <rect x="691.5" y="326.8" width="20" height="12" fill="#ffffff"/><text x="701.5" y="336.3">1..1</text>
    <rect x="808.5" y="301.2" width="20" height="12" fill="#ffffff"/><text x="818.5" y="310.7">0..*</text>
    <!-- Records -->
    <rect x="1012.0" y="279.0" width="20" height="12" fill="#ffffff"/><text x="1022.0" y="288.5">1..1</text>
    <rect x="1058.0" y="279.0" width="20" height="12" fill="#ffffff"/><text x="1068.0" y="288.5">0..*</text>
    <!-- Follows -->
    <rect x="691.4" y="372.9" width="20" height="12" fill="#ffffff"/><text x="701.4" y="382.4">1..1</text>
    <rect x="828.6" y="405.1" width="20" height="12" fill="#ffffff"/><text x="838.6" y="414.6">0..*</text>
    <!-- Records -->
    <rect x="1031.9" y="437.9" width="20" height="12" fill="#ffffff"/><text x="1041.9" y="447.4">1..1</text>
    <rect x="1058.1" y="440.1" width="20" height="12" fill="#ffffff"/><text x="1068.1" y="449.6">0..*</text>
    <!-- Triggers -->
    <rect x="664.4" y="399.3" width="20" height="12" fill="#ffffff"/><text x="674.4" y="408.8">0..1</text>
    <rect x="855.6" y="528.7" width="20" height="12" fill="#ffffff"/><text x="865.6" y="538.2">0..*</text>
    <!-- Has -->
    <rect x="615.8" y="407.1" width="20" height="12" fill="#ffffff"/><text x="625.8" y="416.6">1..1</text>
    <rect x="684.2" y="560.9" width="20" height="12" fill="#ffffff"/><text x="694.2" y="570.4">0..*</text>
    <!-- SummarizedIn -->
    <rect x="593.8" y="421.0" width="20" height="12" fill="#ffffff"/><text x="603.8" y="430.5">0..1</text>
    <rect x="606.2" y="657.0" width="20" height="12" fill="#ffffff"/><text x="616.2" y="666.5">0..*</text>
    <!-- Sends -->
    <rect x="570.4" y="407.9" width="20" height="12" fill="#ffffff"/><text x="580.4" y="417.4">1..1</text>
    <rect x="519.6" y="560.1" width="20" height="12" fill="#ffffff"/><text x="529.6" y="569.6">0..*</text>
    <!-- Owns -->
    <rect x="545.4" y="404.1" width="20" height="12" fill="#ffffff"/><text x="555.4" y="413.6">1..1</text>
    <rect x="294.6" y="713.9" width="20" height="12" fill="#ffffff"/><text x="304.6" y="723.4">0..*</text>
    <!-- Knows -->
    <rect x="488.0" y="342.6" width="20" height="12" fill="#ffffff"/><text x="498.0" y="352.1">1..1</text>
    <rect x="212.0" y="325.4" width="20" height="12" fill="#ffffff"/><text x="222.0" y="334.9">0..*</text>
    <!-- Has -->
    <rect x="488.7" y="374.3" width="20" height="12" fill="#ffffff"/><text x="498.7" y="383.8">1..1</text>
    <rect x="211.3" y="443.7" width="20" height="12" fill="#ffffff"/><text x="221.3" y="453.2">0..*</text>
    <!-- Matches -->
    <rect x="110.0" y="409.0" width="20" height="12" fill="#ffffff"/><text x="120.0" y="418.5">0..*</text>
    <rect x="110.0" y="379.0" width="20" height="12" fill="#ffffff"/><text x="120.0" y="388.5">0..1</text>
    <!-- About -->
    <rect x="516.9" y="399.5" width="20" height="12" fill="#ffffff"/><text x="526.9" y="409.0">1..1</text>
    <rect x="388.1" y="488.5" width="20" height="12" fill="#ffffff"/><text x="398.1" y="498.0">0..*</text>
    <!-- Writes -->
    <rect x="277.3" y="261.8" width="20" height="12" fill="#ffffff"/><text x="287.3" y="271.3">1..1</text>
    <rect x="306.9" y="479.2" width="20" height="12" fill="#ffffff"/><text x="316.9" y="488.7">0..*</text>
    <!-- Handles -->
    <rect x="691.5" y="134.5" width="20" height="12" fill="#ffffff"/><text x="701.5" y="144.0">0..1</text>
    <rect x="828.5" y="105.5" width="20" height="12" fill="#ffffff"/><text x="838.5" y="115.0">0..*</text>
    <!-- GeneratedBy -->
    <rect x="487.0" y="148.0" width="20" height="12" fill="#ffffff"/><text x="497.0" y="157.5">1..1</text>
    <rect x="497.0" y="721.0" width="20" height="12" fill="#ffffff"/><text x="507.0" y="730.5">0..*</text>
    <!-- Receives -->
    <rect x="210.0" y="263.0" width="20" height="12" fill="#ffffff"/><text x="220.0" y="272.5">0..1</text>
    <rect x="930.0" y="519.0" width="20" height="12" fill="#ffffff"/><text x="940.0" y="528.5">0..*</text>
  </g>

  <!-- ================= LEGEND ================= -->
  <text x="40" y="855" font-size="10" fill="#000000">{Optional, Or}: a User may be a Patient or a Caregiver, but never both.</text>
</svg>

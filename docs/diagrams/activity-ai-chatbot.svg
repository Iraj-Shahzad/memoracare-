<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 -5 700 1367" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="20" y="-5" width="700" height="1367" fill="#ffffff"/>

  <g fill="none" stroke="#000000" stroke-width="1.4">
    <!-- e0 start->a1 -->
    <line x1="360" y1="37" x2="360" y2="52" marker-end="url(#arrow)"/>
    <!-- e1 a1->mIn -->
    <line x1="360" y1="92" x2="360" y2="110" marker-end="url(#arrow)"/>
    <!-- eIna2 mIn->a2 -->
    <line x1="360" y1="154" x2="360" y2="180" marker-end="url(#arrow)"/>
    <!-- e2 a2->d0 -->
    <line x1="360" y1="220" x2="360" y2="240" marker-end="url(#arrow)"/>

    <!-- eyes0 d0->astt -->
    <line x1="435" y1="280" x2="480" y2="280" marker-end="url(#arrow)"/>
    <!-- estt astt->m0 -->
    <polyline points="570,302 570,372 390,372" marker-end="url(#arrow)"/>
    <!-- eno0 d0->m0 -->
    <line x1="360" y1="320" x2="360" y2="350" marker-end="url(#arrow)"/>
    <!-- e3 m0->a3 -->
    <line x1="360" y1="394" x2="360" y2="420" marker-end="url(#arrow)"/>

    <!-- ewit0 a3->dWit -->
    <line x1="360" y1="464" x2="360" y2="490" marker-end="url(#arrow)"/>
    <!-- ewityes dWit->aWit -->
    <line x1="275" y1="545" x2="240" y2="545" marker-end="url(#arrow)"/>
    <!-- ewitno dWit->dPy -->
    <line x1="360" y1="600" x2="360" y2="640" marker-end="url(#arrow)"/>
    <!-- epyyes dPy->aPy -->
    <line x1="275" y1="695" x2="240" y2="695" marker-end="url(#arrow)"/>
    <!-- epyno dPy->aRule -->
    <line x1="360" y1="750" x2="360" y2="795" marker-end="url(#arrow)"/>

    <!-- ecWit aWit->mC1 -->
    <polyline points="70,545 40,545 40,827 125,827" marker-end="url(#arrow)"/>
    <!-- ecPy aPy->mC1 -->
    <line x1="155" y1="733" x2="155" y2="805" marker-end="url(#arrow)"/>
    <!-- ec1c2 mC1->mC2 -->
    <polyline points="155,849 155,915 330,915" marker-end="url(#arrow)"/>
    <!-- ecRule aRule->mC2 -->
    <line x1="360" y1="843" x2="360" y2="893" marker-end="url(#arrow)"/>

    <!-- ebuild mC2->aBuild -->
    <line x1="360" y1="937" x2="360" y2="965" marker-end="url(#arrow)"/>
    <!-- e10 aBuild->a8 -->
    <line x1="360" y1="1043" x2="360" y2="1069" marker-end="url(#arrow)"/>
    <!-- e11 a8->a9 -->
    <line x1="360" y1="1109" x2="360" y2="1135" marker-end="url(#arrow)"/>
    <!-- e12 a9->d2 -->
    <line x1="360" y1="1175" x2="360" y2="1195" marker-end="url(#arrow)"/>
    <!-- eloop d2->mIn -->
    <polyline points="445,1240 700,1240 700,132 390,132" marker-end="url(#arrow)"/>
    <!-- eout d2->fin -->
    <line x1="360" y1="1285" x2="360" y2="1316" marker-end="url(#arrow)"/>
  </g>

  <!-- guard labels -->
  <g fill="#000000">
    <text x="443" y="274">[Yes]</text>
    <text x="368" y="342">[No]</text>
    <text x="272" y="539" text-anchor="end">[Yes]</text>
    <text x="368" y="632">[No]</text>
    <text x="272" y="689" text-anchor="end">[Yes]</text>
    <text x="368" y="787">[No]</text>
    <text x="455" y="1234">[Yes]</text>
    <text x="368" y="1308">[No]</text>
  </g>

  <!-- initial node -->
  <circle cx="360" cy="26" r="11" fill="#000000" stroke="#000000" stroke-width="1.4"/>

  <!-- actions, decisions and merges -->
  <g stroke="#000000" stroke-width="1.4">
    <rect x="270" y="52" width="180" height="40" rx="12" fill="#ffffff"/>
    <polygon points="360,110 390,132 360,154 330,132" fill="#ffffff"/>
    <rect x="255" y="180" width="210" height="40" rx="12" fill="#ffffff"/>
    <polygon points="360,240 435,280 360,320 285,280" fill="#ffffff"/>
    <rect x="480" y="258" width="180" height="44" rx="12" fill="#ffffff"/>
    <polygon points="360,350 390,372 360,394 330,372" fill="#ffffff"/>

    <rect x="260" y="420" width="200" height="44" rx="12" fill="#ffffff"/>
    <polygon points="360,490 445,545 360,600 275,545" fill="#ffffff"/>
    <rect x="70" y="521" width="170" height="48" rx="12" fill="#ffffff"/>

    <polygon points="360,640 445,695 360,750 275,695" fill="#ffffff"/>
    <rect x="70" y="657" width="170" height="76" rx="12" fill="#ffffff"/>

    <rect x="245" y="795" width="230" height="48" rx="12" fill="#ffffff"/>
    <polygon points="155,805 185,827 155,849 125,827" fill="#ffffff"/>
    <polygon points="360,893 390,915 360,937 330,915" fill="#ffffff"/>

    <rect x="230" y="965" width="260" height="78" rx="12" fill="#ffffff"/>
    <rect x="255" y="1069" width="210" height="40" rx="12" fill="#ffffff"/>
    <rect x="260" y="1135" width="200" height="40" rx="12" fill="#ffffff"/>
    <polygon points="360,1195 445,1240 360,1285 275,1240" fill="#ffffff"/>
  </g>

  <!-- final node -->
  <circle cx="360" cy="1329" r="13" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <circle cx="360" cy="1329" r="7" fill="#000000" stroke="#000000" stroke-width="1.4"/>

  <!-- labels -->
  <g fill="#000000" text-anchor="middle">
    <text x="360" y="76">Open chatbot</text>
    <text x="360" y="204">Enter message (text or voice)</text>
    <text x="360" y="284">Voice input?</text>
    <text x="570" y="284">Convert speech to text</text>

    <text x="360" y="438">Classify intent via Wit.ai</text>
    <text x="360" y="452">(cloud NLU)</text>

    <text x="360" y="531">Wit.ai configured</text>
    <text x="360" y="545">and confidence</text>
    <text x="360" y="559">above 0.55?</text>
    <text x="155" y="541">Use Wit.ai intent</text>
    <text x="155" y="555">(primary)</text>

    <text x="360" y="681">Flask model</text>
    <text x="360" y="695">reachable within</text>
    <text x="360" y="709">8 seconds?</text>
    <text x="155" y="674">Use self-hosted</text>
    <text x="155" y="688">Python/Flask</text>
    <text x="155" y="702">model intent</text>
    <text x="155" y="716">(fallback)</text>

    <text x="360" y="815">Use rule-based keyword</text>
    <text x="360" y="829">matching (last resort)</text>

    <text x="360" y="983">Build reply in the chosen</text>
    <text x="360" y="997">language (EN or UR) by</text>
    <text x="360" y="1011">injecting the patient's</text>
    <text x="360" y="1025">database records</text>

    <text x="360" y="1093">Send reply: display and speak</text>
    <text x="360" y="1159">Save to chat history</text>
    <text x="360" y="1244">Continue chat?</text>
  </g>
</svg>

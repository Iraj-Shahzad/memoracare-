<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 0 655 760" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="800" fill="#ffffff"/>

  <g fill="none" stroke="#000000" stroke-width="1.4">
    <!-- e0 start->a1 -->
    <line x1="340" y1="37" x2="340" y2="52" marker-end="url(#arrow)"/>
    <!-- e1 a1->a2 -->
    <line x1="340" y1="92" x2="340" y2="108" marker-end="url(#arrow)"/>
    <!-- e2 a2->d1 -->
    <line x1="340" y1="148" x2="340" y2="160" marker-end="url(#arrow)"/>
    <!-- eyes d1->a3 -->
    <polyline points="260,200 150,200 150,270" marker-end="url(#arrow)"/>
    <!-- eno d1->a7 -->
    <polyline points="420,200 530,200 530,270" marker-end="url(#arrow)"/>
    <!-- e3 a3->a4 -->
    <line x1="150" y1="310" x2="150" y2="336" marker-end="url(#arrow)"/>
    <!-- e4 a4->d2 -->
    <line x1="150" y1="376" x2="150" y2="392" marker-end="url(#arrow)"/>
    <!-- ed2no d2->a3 -->
    <polyline points="82,430 40,430 40,290 60,290" marker-end="url(#arrow)"/>
    <!-- ed2yes d2->a6 -->
    <line x1="150" y1="468" x2="150" y2="500" marker-end="url(#arrow)"/>
    <!-- e5 a7->a8 -->
    <line x1="530" y1="310" x2="530" y2="336" marker-end="url(#arrow)"/>
    <!-- e6 a8->d3 -->
    <line x1="530" y1="376" x2="530" y2="392" marker-end="url(#arrow)"/>
    <!-- ed3no d3->a7 -->
    <polyline points="598,430 640,430 640,290 620,290" marker-end="url(#arrow)"/>
    <!-- ed3yes d3->m -->
    <polyline points="530,468 530,600 375,600" marker-end="url(#arrow)"/>
    <!-- ea6m a6->m -->
    <polyline points="150,544 150,600 305,600" marker-end="url(#arrow)"/>
    <!-- em m->a10 -->
    <line x1="340" y1="625" x2="340" y2="650" marker-end="url(#arrow)"/>
    <!-- efin a10->fin1 -->
    <line x1="340" y1="694" x2="340" y2="717" marker-end="url(#arrow)"/>
  </g>

  <!-- guard labels -->
  <g fill="#000000">
    <text x="200" y="194" text-anchor="end">[Yes]</text>
    <text x="480" y="194">[No]</text>
    <text x="34" y="362" text-anchor="end">[No]</text>
    <text x="158" y="488">[Yes]</text>
    <text x="646" y="362">[No]</text>
    <text x="522" y="540" text-anchor="end">[Yes]</text>
  </g>

  <!-- start node -->
  <circle cx="340" cy="26" r="11" fill="#000000" stroke="#000000" stroke-width="1.4"/>

  <!-- action / decision nodes -->
  <g stroke="#000000" stroke-width="1.4">
    <rect x="250" y="52" width="180" height="40" rx="12" fill="#ffffff"/>
    <rect x="230" y="108" width="220" height="40" rx="12" fill="#ffffff"/>
    <polygon points="340,160 420,200 340,240 260,200" fill="#ffffff"/>

    <rect x="60" y="270" width="180" height="40" rx="12" fill="#ffffff"/>
    <rect x="60" y="336" width="180" height="40" rx="12" fill="#ffffff"/>
    <polygon points="150,392 218,430 150,468 82,430" fill="#ffffff"/>
    <rect x="55" y="500" width="190" height="44" rx="12" fill="#ffffff"/>

    <rect x="440" y="270" width="180" height="40" rx="12" fill="#ffffff"/>
    <rect x="440" y="336" width="180" height="40" rx="12" fill="#ffffff"/>
    <polygon points="530,392 598,430 530,468 462,430" fill="#ffffff"/>

    <polygon points="340,575 375,600 340,625 305,600" fill="#ffffff"/>
    <rect x="245" y="650" width="190" height="44" rx="12" fill="#ffffff"/>
  </g>

  <!-- final node -->
  <circle cx="340" cy="730" r="13" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <circle cx="340" cy="730" r="7" fill="#000000" stroke="#000000" stroke-width="1.4"/>

  <!-- labels -->
  <g fill="#000000" text-anchor="middle">
    <text x="340" y="76">Open Memory Assistant</text>
    <text x="340" y="124">Display Login /</text>
    <text x="340" y="138">Register options</text>
    <text x="340" y="204">New user?</text>

    <text x="150" y="294">Fill registration form</text>
    <text x="150" y="360">Validate data</text>
    <text x="150" y="434">Data valid?</text>
    <text x="150" y="518">Save to DB &amp;</text>
    <text x="150" y="532">generate User ID</text>

    <text x="530" y="294">Enter credentials</text>
    <text x="530" y="360">Verify credentials</text>
    <text x="530" y="434">Valid?</text>

    <text x="340" y="668">Redirect to role-based</text>
    <text x="340" y="682">dashboard</text>
  </g>
</svg>

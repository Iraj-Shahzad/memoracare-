<svg xmlns="http://www.w3.org/2000/svg" viewBox="15 -5 745 932" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="15" y="-5" width="745" height="932" fill="#ffffff"/>

  <g fill="none" stroke="#000000" stroke-width="1.4">
    <!-- e0 start->dSch -->
    <line x1="300" y1="37" x2="300" y2="60" marker-end="url(#arrow)"/>
    <!-- eschno dSch->final (routine not scheduled today) -->
    <polyline points="390,100 740,100 740,894 313,894" marker-end="url(#arrow)"/>
    <!-- eschyes dSch->a1 -->
    <line x1="300" y1="140" x2="300" y2="170" marker-end="url(#arrow)"/>
    <!-- e1 a1->a2 -->
    <line x1="300" y1="210" x2="300" y2="226" marker-end="url(#arrow)"/>
    <!-- e2 a2->d1 -->
    <line x1="300" y1="270" x2="300" y2="285" marker-end="url(#arrow)"/>

    <!-- eyes d1->a3 -->
    <polyline points="215,330 130,330 130,410" marker-end="url(#arrow)"/>
    <!-- ea3m a3->m -->
    <polyline points="130,450 130,760 270,760" marker-end="url(#arrow)"/>

    <!-- eno d1->dAL -->
    <polyline points="385,330 560,330 560,370" marker-end="url(#arrow)"/>
    <!-- ealyes dAL->m -->
    <polyline points="470,415 400,415 400,720 300,720 300,738" marker-end="url(#arrow)"/>
    <!-- ealno dAL->a4 -->
    <line x1="560" y1="460" x2="560" y2="495" marker-end="url(#arrow)"/>
    <!-- e4 a4->a5 -->
    <line x1="560" y1="559" x2="560" y2="585" marker-end="url(#arrow)"/>
    <!-- e5 a5->a6 -->
    <line x1="560" y1="625" x2="560" y2="645" marker-end="url(#arrow)"/>
    <!-- e6 a6->m -->
    <polyline points="560,723 560,760 330,760" marker-end="url(#arrow)"/>

    <!-- e7 m->a7 -->
    <line x1="300" y1="782" x2="300" y2="810" marker-end="url(#arrow)"/>
    <!-- e8 a7->fin -->
    <line x1="300" y1="850" x2="300" y2="881" marker-end="url(#arrow)"/>
  </g>

  <!-- guard labels -->
  <g fill="#000000">
    <text x="398" y="94">[No]</text>
    <text x="308" y="160">[Yes]</text>
    <text x="207" y="324" text-anchor="end">[Yes]</text>
    <text x="393" y="324">[No]</text>
    <text x="462" y="409" text-anchor="end">[Yes]</text>
    <text x="568" y="483">[No]</text>
  </g>

  <!-- initial node -->
  <circle cx="300" cy="26" r="11" fill="#000000" stroke="#000000" stroke-width="1.4"/>

  <!-- actions, decisions and merges -->
  <g stroke="#000000" stroke-width="1.4">
    <polygon points="300,60 390,100 300,140 210,100" fill="#ffffff"/>
    <rect x="205" y="170" width="190" height="40" rx="12" fill="#ffffff"/>
    <rect x="185" y="226" width="230" height="44" rx="12" fill="#ffffff"/>
    <polygon points="300,285 385,330 300,375 215,330" fill="#ffffff"/>

    <rect x="35" y="410" width="190" height="40" rx="12" fill="#ffffff"/>

    <polygon points="560,370 650,415 560,460 470,415" fill="#ffffff"/>
    <rect x="445" y="495" width="230" height="64" rx="12" fill="#ffffff"/>
    <rect x="465" y="585" width="190" height="40" rx="12" fill="#ffffff"/>
    <rect x="435" y="645" width="250" height="78" rx="12" fill="#ffffff"/>

    <polygon points="300,738 330,760 300,782 270,760" fill="#ffffff"/>
    <rect x="200" y="810" width="200" height="40" rx="12" fill="#ffffff"/>
  </g>

  <!-- final node -->
  <circle cx="300" cy="894" r="13" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <circle cx="300" cy="894" r="7" fill="#000000" stroke="#000000" stroke-width="1.4"/>

  <!-- labels -->
  <g fill="#000000" text-anchor="middle">
    <text x="300" y="96">Scheduled for</text>
    <text x="300" y="110">today?</text>
    <text x="300" y="194">Routine time reached</text>
    <text x="300" y="244">Send reminder to patient</text>
    <text x="300" y="258">(voice and on-screen)</text>
    <text x="300" y="334">Marked complete?</text>

    <text x="130" y="434">Log as completed</text>

    <text x="560" y="411">Already logged</text>
    <text x="560" y="425">today?</text>

    <text x="560" y="513">Wait 30 minute grace</text>
    <text x="560" y="527">period (missed sweep</text>
    <text x="560" y="541">runs every 10 minutes)</text>

    <text x="560" y="609">Create missed log</text>

    <text x="560" y="663">Create Alert (routine_missed;</text>
    <text x="560" y="677">critical if priority is high,</text>
    <text x="560" y="691">else warning) and emit to</text>
    <text x="560" y="705">assigned caregivers</text>

    <text x="300" y="834">Refresh routine status view</text>
  </g>
</svg>

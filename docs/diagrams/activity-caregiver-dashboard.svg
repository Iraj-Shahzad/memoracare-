<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -5 525 1042" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="-5" y="-5" width="525" height="1042" fill="#ffffff"/>

  <g fill="none" stroke="#000000" stroke-width="1.4">
    <!-- e0 start->a1 -->
    <line x1="300" y1="37" x2="300" y2="52" marker-end="url(#arrow)"/>
    <!-- e1 a1->a2 -->
    <line x1="300" y1="92" x2="300" y2="108" marker-end="url(#arrow)"/>
    <!-- e2 a2->mSel -->
    <line x1="300" y1="148" x2="300" y2="164" marker-end="url(#arrow)"/>
    <!-- eaccept accept event -> mSel -->
    <line x1="230" y1="186" x2="270" y2="186" marker-end="url(#arrow)"/>
    <!-- e3 mSel->a3 -->
    <line x1="300" y1="208" x2="300" y2="234" marker-end="url(#arrow)"/>
    <!-- e4 a3->a4 -->
    <line x1="300" y1="274" x2="300" y2="290" marker-end="url(#arrow)"/>
    <!-- e5 a4->d1 -->
    <line x1="300" y1="334" x2="300" y2="350" marker-end="url(#arrow)"/>

    <!-- eyes d1->a5 -->
    <polyline points="215,395 115,395 115,445" marker-end="url(#arrow)"/>
    <!-- eno d1->m1 -->
    <polyline points="385,395 450,395 450,740 330,740" marker-end="url(#arrow)"/>

    <!-- e6 a5->dNote -->
    <line x1="115" y1="493" x2="115" y2="515" marker-end="url(#arrow)"/>
    <!-- ednyes dNote->aNote -->
    <line x1="115" y1="605" x2="115" y2="650" marker-end="url(#arrow)"/>
    <!-- ednno dNote->m1 -->
    <polyline points="200,560 240,560 240,700 300,700 300,718" marker-end="url(#arrow)"/>
    <!-- enotem aNote->m1 -->
    <polyline points="115,690 115,740 270,740" marker-end="url(#arrow)"/>

    <!-- e7 m1->d2 -->
    <line x1="300" y1="762" x2="300" y2="790" marker-end="url(#arrow)"/>
    <!-- eloop d2->mSel -->
    <polyline points="390,840 500,840 500,186 330,186" marker-end="url(#arrow)"/>
    <!-- eout d2->a6 -->
    <line x1="300" y1="890" x2="300" y2="920" marker-end="url(#arrow)"/>
    <!-- efin a6->fin -->
    <line x1="300" y1="960" x2="300" y2="991" marker-end="url(#arrow)"/>
  </g>

  <!-- note anchor -->
  <line x1="95" y1="250" x2="95" y2="208" stroke="#000000" stroke-width="1.4" stroke-dasharray="4 3"/>

  <!-- guard labels -->
  <g fill="#000000">
    <text x="207" y="389" text-anchor="end">[Yes]</text>
    <text x="393" y="389">[No]</text>
    <text x="123" y="632">[Yes]</text>
    <text x="208" y="554">[No]</text>
    <text x="398" y="834">[Yes]</text>
    <text x="308" y="912">[No]</text>
  </g>

  <!-- initial node -->
  <circle cx="300" cy="26" r="11" fill="#000000" stroke="#000000" stroke-width="1.4"/>

  <!-- actions, decisions and merges -->
  <g stroke="#000000" stroke-width="1.4">
    <rect x="205" y="52" width="190" height="40" rx="12" fill="#ffffff"/>
    <rect x="205" y="108" width="190" height="40" rx="12" fill="#ffffff"/>

    <rect x="30" y="164" width="200" height="44" rx="12" fill="#ffffff"/>
    <polygon points="15,250 161,250 175,264 175,320 15,320" fill="#ffffff"/>
    <polyline points="161,250 161,264 175,264" fill="none"/>

    <polygon points="300,164 330,186 300,208 270,186" fill="#ffffff"/>
    <rect x="205" y="234" width="190" height="40" rx="12" fill="#ffffff"/>
    <rect x="185" y="290" width="230" height="44" rx="12" fill="#ffffff"/>
    <polygon points="300,350 385,395 300,440 215,395" fill="#ffffff"/>

    <rect x="15" y="445" width="200" height="48" rx="12" fill="#ffffff"/>
    <polygon points="115,515 200,560 115,605 30,560" fill="#ffffff"/>
    <rect x="25" y="650" width="180" height="40" rx="12" fill="#ffffff"/>

    <polygon points="300,718 330,740 300,762 270,740" fill="#ffffff"/>
    <polygon points="300,790 390,840 300,890 210,840" fill="#ffffff"/>
    <rect x="210" y="920" width="180" height="40" rx="12" fill="#ffffff"/>
  </g>

  <!-- final node -->
  <circle cx="300" cy="1004" r="13" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <circle cx="300" cy="1004" r="7" fill="#000000" stroke="#000000" stroke-width="1.4"/>

  <!-- labels -->
  <g fill="#000000" text-anchor="middle">
    <text x="300" y="76">Caregiver logs in</text>
    <text x="300" y="132">Load assigned patients</text>

    <text x="130" y="182">Alert received</text>
    <text x="130" y="196">over Socket.io</text>

    <text x="95" y="272">Accept event: alert</text>
    <text x="95" y="286">pushed by Socket.io</text>
    <text x="95" y="300">while page is open</text>

    <text x="300" y="258">Select patient</text>
    <text x="300" y="308">View status, compliance</text>
    <text x="300" y="322">and alerts</text>
    <text x="300" y="399">Alerts present?</text>

    <text x="115" y="465">Review alert and</text>
    <text x="115" y="479">mark resolved</text>
    <text x="115" y="556">Add care</text>
    <text x="115" y="570">note?</text>
    <text x="115" y="674">Write care note</text>

    <text x="300" y="844">Monitor another?</text>
    <text x="300" y="944">Log out</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -5 710 440" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="sync" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#000000"/>
    </marker>
    <marker id="ret" markerWidth="16" markerHeight="14" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#000000" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="430" fill="#ffffff"/>

  <!-- diagram frame + tab -->
  <rect x="15" y="15" width="670" height="400" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <path d="M15,15 H172 V31 L164,39 H15 Z" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="23" y="31" font-weight="bold">sd  Chat with Assistant</text>

  <!-- actor -->
  <circle cx="110" cy="59" r="8" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <line x1="110" y1="67" x2="110" y2="93" stroke="#000000" stroke-width="1.4"/>
  <line x1="93" y1="75" x2="127" y2="75" stroke="#000000" stroke-width="1.4"/>
  <line x1="110" y1="93" x2="97" y2="117" stroke="#000000" stroke-width="1.4"/>
  <line x1="110" y1="93" x2="123" y2="117" stroke="#000000" stroke-width="1.4"/>
  <text x="110" y="133" text-anchor="middle" font-weight="bold">Patient</text>
  <line x1="110" y1="152" x2="110" y2="405" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- system -->
  <rect x="505" y="86" width="120" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="565" y="111" text-anchor="middle" font-weight="bold">:System</text>
  <line x1="565" y1="126" x2="565" y2="405" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- loop frame -->
  <rect x="78" y="192" width="545" height="150" fill="none" stroke="#000000" stroke-width="1.4"/>
  <path d="M78,192 H120 V204 L114,210 H78 Z" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="84" y="205" font-size="11" font-weight="bold">loop</text>
  <text x="126" y="205" font-size="11">[while patient is chatting]</text>

  <!-- m1 call -->
  <text x="335" y="250" text-anchor="middle">sendMessage(patientId, message, mode, lang)</text>
  <line x1="110" y1="255" x2="560" y2="255" stroke="#000000" stroke-width="1.4" marker-end="url(#sync)"/>
  <rect x="560" y="255" width="9" height="46" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <!-- m2 return -->
  <text x="335" y="296" text-anchor="middle" font-style="italic">reply(text, intent, source)</text>
  <line x1="560" y1="301" x2="110" y2="301" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ret)"/>
</svg>

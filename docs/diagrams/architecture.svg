<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 18 830 710" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="10" y="18" width="830" height="710" fill="#ffffff"/>

  <!-- ===================== Client tier ===================== -->
  <rect x="30" y="38" width="700" height="150" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="38" y="55" font-size="12" font-weight="bold">Client Tier : Web Browser (Next.js, React, TypeScript)</text>

  <rect x="45" y="80" width="122" height="90" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="106" y="129" font-size="11" text-anchor="middle">Patient UI</text>

  <rect x="178" y="80" width="122" height="90" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="239" y="129" font-size="11" text-anchor="middle">Caregiver UI</text>

  <rect x="311" y="80" width="122" height="90" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="372" y="129" font-size="11" text-anchor="middle">Admin Panel</text>

  <rect x="444" y="80" width="132" height="90" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="510" y="122" font-size="11" text-anchor="middle">face-api.js</text>
  <text x="510" y="137" font-size="11" text-anchor="middle">(Face Recognition)</text>

  <rect x="587" y="80" width="128" height="90" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="651" y="122" font-size="11" text-anchor="middle">Web Speech</text>
  <text x="651" y="137" font-size="11" text-anchor="middle">(Voice EN/UR)</text>

  <!-- ===================== Application tier ===================== -->
  <rect x="30" y="275" width="470" height="260" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="38" y="292" font-size="12" font-weight="bold">Application Tier : Express + Node.js (TypeScript)</text>

  <rect x="48" y="315" width="200" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="148" y="341" font-size="11" text-anchor="middle">JWT Auth, Role Authorization,</text>
  <text x="148" y="356" font-size="11" text-anchor="middle">Patient Ownership Guard</text>

  <rect x="262" y="315" width="220" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="372" y="339" font-size="11" text-anchor="middle">REST Controllers (meds,</text>
  <text x="372" y="354" font-size="11" text-anchor="middle">routines, chat, face, alerts,</text>
  <text x="372" y="369" font-size="11" text-anchor="middle">reports)</text>

  <rect x="48" y="388" width="200" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="148" y="422" font-size="11" text-anchor="middle">Socket.io Server</text>

  <rect x="262" y="388" width="220" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="372" y="422" font-size="11" text-anchor="middle">Reminder Scheduler (node-cron)</text>

  <rect x="48" y="461" width="434" height="60" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="265" y="485" font-size="11" text-anchor="middle">Rule-based keyword matching</text>
  <text x="265" y="500" font-size="11" text-anchor="middle">(last resort : in Node backend)</text>

  <!-- ============ Wit.ai Cloud NLU : sits to the RIGHT of the Application tier ============ -->
  <path d="M 633 358 C 610 358 610 324 635 321 C 630 293 678 285 692 303 C 701 287 746 287 753 306 C 780 296 809 312 797 333 C 820 337 817 363 792 360 C 780 375 644 375 633 358 Z"
        fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="717" y="319" font-size="11" font-weight="bold" text-anchor="middle">Wit.ai Cloud NLU</text>
  <text x="717" y="334" font-size="11" text-anchor="middle">(primary intent</text>
  <text x="717" y="349" font-size="11" text-anchor="middle">classifier)</text>

  <!-- ===================== AI Services layer (offline fallback) ===================== -->
  <rect x="610" y="400" width="210" height="130" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="618" y="417" font-size="12" font-weight="bold">AI Services Layer : Flask</text>
  <text x="618" y="432" font-size="12" font-weight="bold">(Python), offline fallback</text>

  <rect x="628" y="448" width="174" height="66" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="715" y="470" font-size="11" text-anchor="middle">Custom Chatbot Model</text>
  <text x="715" y="485" font-size="11" text-anchor="middle">(Keras + TF-IDF + NLTK),</text>
  <text x="715" y="500" font-size="11" text-anchor="middle">offline fallback</text>

  <!-- ===================== Data tier ===================== -->
  <rect x="30" y="560" width="470" height="120" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="38" y="577" font-size="12" font-weight="bold">Data Tier : MongoDB (Mongoose ODM)</text>

  <rect x="48" y="598" width="434" height="66" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="265" y="618" font-size="11" text-anchor="middle">Collections: Users, Patients, Caregivers, Medications, Routines,</text>
  <text x="265" y="633" font-size="11" text-anchor="middle">MedicationLog, RoutineLog, Alerts, KnownFaces, Memories, Notes,</text>
  <text x="265" y="648" font-size="11" text-anchor="middle">Reports, ChatHistory, RecognitionLog, Reminder, Contact</text>

  <!-- ===================== Connectors ===================== -->
  <!-- Client <-> Application -->
  <line x1="270" y1="188" x2="270" y2="275" stroke="#000000" stroke-width="1.4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="280" y="235" font-size="10">REST API (HTTPS/JSON) + Socket.io</text>

  <!-- Application <-> Wit.ai (primary cloud NLU) -->
  <line x1="500" y1="340" x2="616" y2="340" stroke="#000000" stroke-width="1.4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="558" y="332" font-size="10" text-anchor="middle">HTTPS (cloud NLU)</text>

  <!-- Application <-> Flask (offline fallback) -->
  <line x1="500" y1="440" x2="610" y2="440" stroke="#000000" stroke-width="1.4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="555" y="420" font-size="10" text-anchor="middle">HTTP /predict</text>
  <text x="555" y="432" font-size="10" text-anchor="middle">(offline fallback)</text>

  <!-- Application <-> Data -->
  <line x1="240" y1="535" x2="240" y2="560" stroke="#000000" stroke-width="1.4" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="250" y="551" font-size="10">Mongoose ODM</text>

  <!-- ===================== Caption ===================== -->
  <text x="30" y="704" font-size="10" font-style="italic">Figure: layered architecture view (informal notation, not a UML component diagram)</text>
</svg>

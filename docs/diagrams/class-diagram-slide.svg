  <!-- ===================== CLASS NAMES ===================== -->
  <g font-size="22" font-weight="bold" text-anchor="middle" fill="#000000">
    <text x="240" y="94">AuthMiddleware</text>
    <text x="1250" y="94">AccessGuard</text>
    <text x="2130" y="94">ReminderScheduler</text>
    <text x="250" y="322">AuthController</text>
    <text x="830" y="322">MedicationController</text>
    <text x="1505" y="322">FaceRecognitionController</text>
    <text x="2110" y="322">ChatController</text>
    <text x="510" y="542">Caregiver</text>
    <text x="1000" y="542">User</text>

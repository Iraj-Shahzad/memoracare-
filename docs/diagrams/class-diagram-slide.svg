    <path d="M 240 392 L 240 640 L 780 640"/>   <!-- AuthController -> User -->
    <path d="M 700 392 L 700 740"/>   <!-- MedicationController -> Medication -->
    <path d="M 1310 392 L 1310 740"/>   <!-- FaceRecognitionController -> KnownFace -->
    <path d="M 2200 392 L 2200 740"/>   <!-- ChatController -> ChatHistory -->
  </g>


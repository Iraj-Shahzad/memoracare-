    <text x="1080" y="790">MedicationLog</text>
    <text x="1440" y="790">KnownFace</text>
    <text x="2200" y="790">ChatHistory</text>
  </g>

  <!-- ============= ATTRIBUTES AND OPERATIONS =============== -->
  <g font-size="20" fill="#000000">
    <!-- AuthMiddleware -->
    <text x="50" y="121">- jwtSecret : String</text>
    <text x="50" y="145">+ protect(req : Request) : void</text>
    <text x="50" y="169">+ authorize(roles : String[]) : Function</text>
    <!-- AccessGuard -->
    <text x="970" y="135">+ canAccessPatient(user : User, patientId : String) : Boolean</text>
    <!-- ReminderScheduler -->
    <text x="1910" y="121">- GRACE_MINUTES : Number</text>
    <text x="1910" y="145">+ start(io : SocketServer) : void</text>
    <text x="1910" y="169">+ parseTimeToMinutes(value : String) : Number</text>
    <text x="1910" y="193">- emitDueReminders(io : SocketServer) : void</text>
    <text x="1910" y="217">- detectMissed(io : SocketServer) : void</text>
    <!-- AuthController -->
    <text x="50" y="363">+ login(email : String, pwd : String) : String</text>
    <text x="50" y="387">+ register(email : String, role : String) : User</text>
    <!-- MedicationController -->
    <text x="530" y="363">+ getByPatient(patientId : String) : Medication[]</text>
    <text x="530" y="387">+ logMedicationStatus(id : String, status : String) : MedicationLog</text>
    <!-- FaceRecognitionController -->
    <text x="1210" y="363">+ recognizeFace(patientId : String, result : String,</text>
    <text x="1242" y="387">confidence : Number, knownFaceId : String) : RecognitionLog</text>
    <!-- ChatController -->
    <text x="1880" y="363">+ sendMessage(query : String) : ChatHistory</text>
    <text x="1880" y="387">+ getChatHistory(patientId : String) : ChatHistory[]</text>
    <!-- Caregiver -->
    <text x="390" y="569">- specialization : String</text>
    <text x="390" y="593">- notes : String</text>
    <!-- User -->
    <text x="790" y="569">- email : String  { unique }</text>
    <text x="790" y="593">- password : String</text>
    <text x="790" y="617">- role : String</text>
    <text x="790" y="641">+ matchPassword(entered : String) : Boolean</text>
    <text x="790" y="665">+ getResetPasswordToken() : String</text>
    <!-- EmergencyContact -->
    <text x="1350" y="569">- name : String</text>
    <text x="1350" y="593">- relationship : String</text>
    <text x="1350" y="617">- phone : String</text>
    <!-- Patient -->
    <text x="1760" y="569">- dateOfBirth : Date</text>
    <text x="1760" y="593">- cnic : String  { unique }</text>
    <text x="1760" y="617">- diagnosis : String</text>
    <!-- Alert -->
    <text x="50" y="817">- type : String</text>
    <text x="50" y="841">- severity : String</text>
    <text x="50" y="865">- isResolved : Boolean</text>
    <!-- Medication -->
    <text x="570" y="817">- name : String</text>
    <text x="570" y="841">- dosage : String</text>
    <text x="570" y="865">- times : String[]</text>
    <!-- MedicationLog -->
    <text x="950" y="817">- scheduledTime : Date</text>
    <text x="950" y="841">- status : String</text>
    <text x="950" y="865">- takenAt : Date</text>
    <!-- KnownFace -->
    <text x="1310" y="817">- name : String</text>
    <text x="1310" y="841">- relationship : String</text>
    <text x="1310" y="865">- descriptor : Number[]</text>
    <!-- ChatHistory -->
    <text x="2070" y="817">- query : String</text>
    <text x="2070" y="841">- response : String</text>
    <text x="2070" y="865">- confidence : Number</text>
  </g>


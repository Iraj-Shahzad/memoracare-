<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -5 710 822" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="-5" y="-5" width="710" height="822" fill="#ffffff"/>

  <g fill="none" stroke="#000000" stroke-width="1.4">
    <!-- e0 start->a1 -->
    <line x1="300" y1="37" x2="300" y2="52" marker-end="url(#arrow)"/>
    <!-- e1 a1->a2 -->
    <line x1="300" y1="92" x2="300" y2="108" marker-end="url(#arrow)"/>
    <!-- e2 a2->d1 -->
    <line x1="300" y1="152" x2="300" y2="170" marker-end="url(#arrow)"/>

    <!-- eyes d1->a3 -->
    <polyline points="215,215 130,215 130,296" marker-end="url(#arrow)"/>
    <!-- ea3m a3->m -->
    <polyline points="130,360 130,650 270,650" marker-end="url(#arrow)"/>

    <!-- eno d1->dAL -->
    <polyline points="385,215 560,215 560,255" marker-end="url(#arrow)"/>
    <!-- ealyes dAL->m -->
    <polyline points="470,300 400,300 400,610 300,610 300,628" marker-end="url(#arrow)"/>
    <!-- ealno dAL->a4 -->
    <line x1="560" y1="345" x2="560" y2="380" marker-end="url(#arrow)"/>
    <!-- e4 a4->a5 -->
    <line x1="560" y1="444" x2="560" y2="470" marker-end="url(#arrow)"/>
    <!-- e5 a5->a6 -->
    <line x1="560" y1="510" x2="560" y2="530" marker-end="url(#arrow)"/>
    <!-- e6 a6->m -->
    <polyline points="560,608 560,650 330,650" marker-end="url(#arrow)"/>

    <!-- e7 m->a7 -->
    <line x1="300" y1="672" x2="300" y2="700" marker-end="url(#arrow)"/>
    <!-- e8 a7->fin -->
    <line x1="300" y1="740" x2="300" y2="771" marker-end="url(#arrow)"/>
  </g>

  <!-- guard labels -->
  <g fill="#000000">
    <text x="207" y="209" text-anchor="end">[Yes]</text>
    <text x="393" y="209">[No]</text>
    <text x="462" y="294" text-anchor="end">[Yes]</text>
    <text x="568" y="368">[No]</text>
  </g>

  <!-- initial node -->
  <circle cx="300" cy="26" r="11" fill="#000000" stroke="#000000" stroke-width="1.4"/>

  <!-- actions, decisions and merges -->
  <g stroke="#000000" stroke-width="1.4">
    <rect x="205" y="52" width="190" height="40" rx="12" fill="#ffffff"/>
    <rect x="185" y="108" width="230" height="44" rx="12" fill="#ffffff"/>
    <polygon points="300,170 385,215 300,260 215,215" fill="#ffffff"/>

    <rect x="15" y="296" width="230" height="64" rx="12" fill="#ffffff"/>

    <polygon points="560,255 650,300 560,345 470,300" fill="#ffffff"/>
    <rect x="445" y="380" width="230" height="64" rx="12" fill="#ffffff"/>
    <rect x="465" y="470" width="190" height="40" rx="12" fill="#ffffff"/>
    <rect x="435" y="530" width="250" height="78" rx="12" fill="#ffffff"/>

    <polygon points="300,628 330,650 300,672 270,650" fill="#ffffff"/>
    <rect x="200" y="700" width="200" height="40" rx="12" fill="#ffffff"/>
  </g>

  <!-- final node -->
  <circle cx="300" cy="784" r="13" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <circle cx="300" cy="784" r="7" fill="#000000" stroke="#000000" stroke-width="1.4"/>

  <!-- labels -->
  <g fill="#000000" text-anchor="middle">
    <text x="300" y="76">Medication time reached</text>
    <text x="300" y="126">Send reminder to patient</text>
    <text x="300" y="140">(voice and on-screen)</text>
    <text x="300" y="219">Marked as taken?</text>

    <text x="130" y="314">Update today's log if</text>
    <text x="130" y="328">present, else create</text>
    <text x="130" y="342">log (status = taken)</text>

    <text x="560" y="296">Already logged</text>
    <text x="560" y="310">today?</text>

    <text x="560" y="398">Wait 30 minute grace</text>
    <text x="560" y="412">period (missed sweep</text>
    <text x="560" y="426">runs every 10 minutes)</text>

    <text x="560" y="494">Create missed log</text>

    <text x="560" y="552">Create Alert</text>
    <text x="560" y="566">(medication_missed, warning)</text>
    <text x="560" y="580">and emit to assigned</text>
    <text x="560" y="594">caregivers</text>

    <text x="300" y="724">Refresh compliance view</text>
  </g>
</svg>

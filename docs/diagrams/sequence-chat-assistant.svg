  <line x1="1404" y1="826" x2="1056" y2="826" stroke="#000000" stroke-width="2" stroke-dasharray="" marker-end="url(#open)"/>
  <!-- m16 : ret -->
  <rect x="911.8" y="833" width="131.2" height="22" fill="#ffffff"/>
  <text x="1038" y="850" text-anchor="end" font-size="20" font-style="italic">responseText</text>
  <line x1="1044" y1="856" x2="636" y2="856" stroke="#000000" stroke-width="2" stroke-dasharray="" marker-end="url(#open)"/>
  <!-- m17 : sync -->
  <rect x="639" y="865" width="547" height="22" fill="#ffffff"/>
  <text x="644" y="882" font-size="20">create({ patient, mode, query, response, intent, confidence })</text>
  <line x1="636" y1="888" x2="1234" y2="888" stroke="#000000" stroke-width="2" marker-end="url(#sync)"/>
  <!-- m18 : async -->
  <rect x="639" y="897" width="329.9" height="22" fill="#ffffff"/>
  <text x="644" y="914" font-size="20">emit("chat_message", patientRoom)</text>
  <line x1="636" y1="920" x2="1594" y2="920" stroke="#000000" stroke-width="2" marker-end="url(#open)"/>
  <!-- m19 : ret -->
  <rect x="205.4" y="927" width="417.6" height="22" fill="#ffffff"/>
  <text x="618" y="944" text-anchor="end" font-size="20" font-style="italic">201 { chat, source: "wit.ai" | "python" | "rules" }</text>
  <line x1="624" y1="950" x2="206" y2="950" stroke="#000000" stroke-width="2" stroke-dasharray="" marker-end="url(#open)"/>
  <!-- m20 : ret -->
  <rect x="56" y="957" width="275.7" height="22" fill="#ffffff"/>

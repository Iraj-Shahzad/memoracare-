  <text x="644" y="326" font-size="20">canAccessPatient(user, patientId)</text>
  <line x1="636" y1="332" x2="834" y2="332" stroke="#000000" stroke-width="2" marker-end="url(#sync)"/>
  <!-- m6 : ret -->
  <rect x="698.5" y="339" width="134.5" height="22" fill="#ffffff"/>

  <text x="1038" y="704" text-anchor="end" font-size="20" font-style="italic">{ intent, response, confidence }</text>
  <line x1="1044" y1="710" x2="636" y2="710" stroke="#000000" stroke-width="2" stroke-dasharray="" marker-end="url(#open)"/>

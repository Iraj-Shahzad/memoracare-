<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -5 710 998" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 z" fill="#000000"/>
    </marker>
  </defs>

  <rect x="-5" y="-5" width="710" height="998" fill="#ffffff"/>

  <g fill="none" stroke="#000000" stroke-width="1.4">
    <!-- e0 start->a1 -->
    <line x1="300" y1="37" x2="300" y2="52" marker-end="url(#arrow)"/>
    <!-- e1 a1->m0 -->
    <line x1="300" y1="92" x2="300" y2="110" marker-end="url(#arrow)"/>
    <!-- em0a2 m0->a2 -->
    <line x1="300" y1="154" x2="300" y2="180" marker-end="url(#arrow)"/>
    <!-- e2 a2->a3 -->
    <line x1="300" y1="220" x2="300" y2="246" marker-end="url(#arrow)"/>
    <!-- e3 a3->d1 -->
    <line x1="300" y1="310" x2="300" y2="330" marker-end="url(#arrow)"/>

    <!-- eno d1->anf -->
    <line x1="385" y1="375" x2="460" y2="375" marker-end="url(#arrow)"/>
    <!-- eloop anf->m0 (retry capture) -->
    <polyline points="560,353 560,132 330,132" marker-end="url(#arrow)"/>
    <!-- eyes d1->a4 -->
    <line x1="300" y1="420" x2="300" y2="450" marker-end="url(#arrow)"/>

    <!-- e4 a4->a7 -->
    <line x1="300" y1="514" x2="300" y2="540" marker-end="url(#arrow)"/>
    <!-- e5 a7->d2 -->
    <line x1="300" y1="580" x2="300" y2="600" marker-end="url(#arrow)"/>

    <!-- ed2yes d2->a5 -->
    <polyline points="215,645 130,645 130,700" marker-end="url(#arrow)"/>
    <!-- e6 a5->a8 -->
    <line x1="130" y1="748" x2="130" y2="780" marker-end="url(#arrow)"/>
    <!-- ea8m a8->m -->
    <polyline points="130,844 130,900 270,900" marker-end="url(#arrow)"/>

    <!-- ed2no d2->a6 -->
    <polyline points="385,645 560,645 560,702" marker-end="url(#arrow)"/>
    <!-- e7 a6->aalert -->
    <line x1="560" y1="746" x2="560" y2="780" marker-end="url(#arrow)"/>
    <!-- ealm aalert->m -->
    <polyline points="560,858 560,900 330,900" marker-end="url(#arrow)"/>

    <!-- e8 m->fin -->
    <line x1="300" y1="922" x2="300" y2="947" marker-end="url(#arrow)"/>
  </g>

  <!-- guard labels -->
  <g fill="#000000">
    <text x="393" y="369">[No]</text>
    <text x="308" y="442">[Yes]</text>
    <text x="207" y="639" text-anchor="end">[Yes]</text>
    <text x="393" y="639">[No]</text>
  </g>

  <!-- initial node -->
  <circle cx="300" cy="26" r="11" fill="#000000" stroke="#000000" stroke-width="1.4"/>

  <!-- actions, decisions and merges -->
  <g stroke="#000000" stroke-width="1.4">
    <rect x="205" y="52" width="190" height="40" rx="12" fill="#ffffff"/>
    <polygon points="300,110 330,132 300,154 270,132" fill="#ffffff"/>
    <rect x="205" y="180" width="190" height="40" rx="12" fill="#ffffff"/>
    <rect x="185" y="246" width="230" height="64" rx="12" fill="#ffffff"/>
    <polygon points="300,330 385,375 300,420 215,375" fill="#ffffff"/>
    <rect x="460" y="353" width="200" height="44" rx="12" fill="#ffffff"/>

    <rect x="175" y="450" width="250" height="64" rx="12" fill="#ffffff"/>
    <rect x="200" y="540" width="200" height="40" rx="12" fill="#ffffff"/>
    <polygon points="300,600 385,645 300,690 215,645" fill="#ffffff"/>

    <rect x="15" y="700" width="230" height="48" rx="12" fill="#ffffff"/>
    <rect x="15" y="780" width="230" height="64" rx="12" fill="#ffffff"/>

    <rect x="460" y="702" width="200" height="44" rx="12" fill="#ffffff"/>
    <rect x="435" y="780" width="250" height="78" rx="12" fill="#ffffff"/>

    <polygon points="300,878 330,900 300,922 270,900" fill="#ffffff"/>
  </g>

  <!-- final node -->
  <circle cx="300" cy="960" r="13" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <circle cx="300" cy="960" r="7" fill="#000000" stroke="#000000" stroke-width="1.4"/>

  <!-- labels -->
  <g fill="#000000" text-anchor="middle">
    <text x="300" y="76">Open Face Recognition</text>
    <text x="300" y="204">Capture face via camera</text>
    <text x="300" y="264">Extract 128 value face</text>
    <text x="300" y="278">descriptor (browser,</text>
    <text x="300" y="292">face-api.js)</text>
    <text x="300" y="379">Face detected?</text>
    <text x="560" y="379">Show "no face detected"</text>

    <text x="300" y="468">Match against enrolled</text>
    <text x="300" y="482">descriptors in the browser</text>
    <text x="300" y="496">(0.6 distance threshold)</text>
    <text x="300" y="564">Persist RecognitionLog</text>
    <text x="300" y="649">Match found?</text>

    <text x="130" y="720">Display name, relationship</text>
    <text x="130" y="734">and confidence</text>
    <text x="130" y="798">Increment</text>
    <text x="130" y="812">recognitionCount and</text>
    <text x="130" y="826">update lastSeen</text>

    <text x="560" y="728">Show "unknown person"</text>
    <text x="560" y="798">Create Alert</text>
    <text x="560" y="812">(face_unknown, warning) and</text>
    <text x="560" y="826">emit to assigned caregivers</text>
    <text x="560" y="840">over Socket.io</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -5 950 570" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="sync" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#000000"/>
    </marker>
    <marker id="ret" markerWidth="16" markerHeight="14" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#000000" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="560" fill="#ffffff"/>

  <!-- actor -->
  <circle cx="70" cy="27" r="8" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <line x1="70" y1="35" x2="70" y2="61" stroke="#000000" stroke-width="1.4"/>
  <line x1="53" y1="43" x2="87" y2="43" stroke="#000000" stroke-width="1.4"/>
  <line x1="70" y1="61" x2="57" y2="85" stroke="#000000" stroke-width="1.4"/>
  <line x1="70" y1="61" x2="83" y2="85" stroke="#000000" stroke-width="1.4"/>
  <text x="70" y="101" text-anchor="middle" font-weight="bold">Patient</text>
  <line x1="70" y1="106" x2="70" y2="530" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- participant boxes -->
  <rect x="165" y="54" width="130" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="230" y="77" text-anchor="middle" font-weight="bold">:MedicationsPage</text>
  <line x1="230" y1="90" x2="230" y2="530" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/>

  <rect x="368" y="54" width="164" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="450" y="77" text-anchor="middle" font-weight="bold">:MedicationController</text>
  <line x1="450" y1="90" x2="450" y2="530" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/>

  <rect x="595" y="54" width="130" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="660" y="77" text-anchor="middle" font-weight="bold">:MedicationLog</text>
  <line x1="660" y1="90" x2="660" y2="530" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/>

  <rect x="790" y="54" width="120" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="850" y="77" text-anchor="middle" font-weight="bold">:MongoDB</text>
  <line x1="850" y1="90" x2="850" y2="530" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- activation bars -->
  <rect x="225" y="150" width="10" height="318" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <rect x="445" y="185" width="10" height="249" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <rect x="655" y="255" width="10" height="107" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <rect x="845" y="292" width="10" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>

  <!-- m1 -->
  <text x="147" y="145" text-anchor="middle">markAsTaken(medId)</text>
  <line x1="70" y1="150" x2="225" y2="150" stroke="#000000" stroke-width="1.4" marker-end="url(#sync)"/>
  <!-- m2 -->
  <text x="340" y="180" text-anchor="middle" font-size="10">POST /medications/{id}/log {status:"taken"}</text>
  <line x1="235" y1="185" x2="445" y2="185" stroke="#000000" stroke-width="1.4" marker-end="url(#sync)"/>
  <!-- m3 self-call -->
  <text x="509" y="210" font-size="10">verify JWT + canAccessPatient()</text>
  <path d="M455,214 H503 V232 H457" fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#sync)"/>
  <!-- m4 -->
  <text x="555" y="250" text-anchor="middle" font-size="10">create(medId, patientId, "taken")</text>
  <line x1="455" y1="255" x2="655" y2="255" stroke="#000000" stroke-width="1.4" marker-end="url(#sync)"/>
  <!-- m5 -->
  <text x="755" y="287" text-anchor="middle">insert(log)</text>
  <line x1="665" y1="292" x2="845" y2="292" stroke="#000000" stroke-width="1.4" marker-end="url(#sync)"/>
  <!-- r6 -->
  <text x="755" y="323" text-anchor="middle" font-style="italic">saved</text>
  <line x1="845" y1="328" x2="665" y2="328" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ret)"/>
  <!-- r7 -->
  <text x="555" y="357" text-anchor="middle" font-style="italic">log</text>
  <line x1="655" y1="362" x2="455" y2="362" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ret)"/>
  <!-- m8 self-call -->
  <text x="509" y="392" font-size="10">emit "medication_update"</text>
  <path d="M455,396 H503 V414 H457" fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#sync)"/>
  <!-- r9 -->
  <text x="340" y="429" text-anchor="middle" font-style="italic">201 { success, log }</text>
  <line x1="445" y1="434" x2="235" y2="434" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ret)"/>
  <!-- r10 -->
  <text x="152" y="463" text-anchor="middle" font-style="italic">show status "Taken"</text>
  <line x1="225" y1="468" x2="80" y2="468" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ret)"/>
</svg>

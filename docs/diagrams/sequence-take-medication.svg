<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 0 1670 930" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="sync" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#000000"/>
    </marker>
    <marker id="open" markerWidth="16" markerHeight="14" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#000000" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect x="30" y="0" width="1670" height="930" fill="#ffffff"/>

  <!-- actor: Patient -->
  <circle cx="70" cy="27" r="8" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <line x1="70" y1="35" x2="70" y2="61" stroke="#000000" stroke-width="1.4"/>
  <line x1="53" y1="43" x2="87" y2="43" stroke="#000000" stroke-width="1.4"/>
  <line x1="70" y1="61" x2="57" y2="85" stroke="#000000" stroke-width="1.4"/>
  <line x1="70" y1="61" x2="83" y2="85" stroke="#000000" stroke-width="1.4"/>
  <text x="70" y="101" text-anchor="middle" font-weight="bold">Patient</text>
  <line x1="70" y1="106" x2="70" y2="910" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- participant heads + lifelines -->
  <rect x="165" y="54" width="130" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="230" y="77" text-anchor="middle" font-weight="bold">:MedicationsPage</text>
  <line x1="230" y1="90" x2="230" y2="910" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/>

  <rect x="420" y="54" width="140" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="490" y="77" text-anchor="middle" font-weight="bold">:AuthMiddleware</text>
  <line x1="490" y1="90" x2="490" y2="910" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/>

  <rect x="662" y="54" width="176" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="750" y="77" text-anchor="middle" font-weight="bold">:MedicationController</text>
  <line x1="750" y1="90" x2="750" y2="910" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/>

  <rect x="915" y="54" width="130" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="980" y="77" text-anchor="middle" font-weight="bold">:AccessGuard</text>
  <line x1="980" y1="90" x2="980" y2="910" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/>

  <rect x="1130" y="54" width="140" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="1200" y="77" text-anchor="middle" font-weight="bold">:MedicationLog</text>
  <line x1="1200" y1="90" x2="1200" y2="910" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/>

  <rect x="1340" y="54" width="120" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="1400" y="77" text-anchor="middle" font-weight="bold">:MongoDB</text>
  <line x1="1400" y1="90" x2="1400" y2="910" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/>

  <rect x="1520" y="54" width="160" height="36" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="1600" y="77" text-anchor="middle" font-weight="bold">:SocketIOServer</text>
  <line x1="1600" y1="90" x2="1600" y2="910" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- activation bars -->
  <rect x="225" y="150" width="10" height="716" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <rect x="485" y="188" width="10" height="632" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <rect x="745" y="270" width="10" height="560" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <rect x="975" y="306" width="10" height="32" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <rect x="1195" y="374" width="10" height="34" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <rect x="1195" y="480" width="10" height="96" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <rect x="1195" y="640" width="10" height="96" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <rect x="1395" y="512" width="10" height="32" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <rect x="1395" y="672" width="10" height="32" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <rect x="1595" y="794" width="10" height="26" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>

  <!-- m1: Patient -> :MedicationsPage (synchronous) -->
  <text x="78" y="145" font-size="10">markAsTaken(medId)</text>
  <line x1="70" y1="150" x2="225" y2="150" stroke="#000000" stroke-width="1.4" marker-end="url(#sync)"/>

  <!-- m2: :MedicationsPage -> :AuthMiddleware (synchronous) -->
  <text x="243" y="183" font-size="10">POST /medications/{id}/log {status:"taken"}</text>
  <line x1="235" y1="188" x2="485" y2="188" stroke="#000000" stroke-width="1.4" marker-end="url(#sync)"/>

  <!-- m3: protect runs in the middleware, before the controller is entered (self message) -->
  <text x="553" y="212" font-size="10">protect(req, res, next)</text>
  <path d="M495,216 H545 V238 H497" fill="none" stroke="#000000" stroke-width="1.4" marker-end="url(#sync)"/>

  <!-- m4: :AuthMiddleware -> :MedicationController (synchronous) -->
  <text x="505" y="265" font-size="10">next(): logMedicationStatus(req, res)</text>
  <line x1="495" y1="270" x2="745" y2="270" stroke="#000000" stroke-width="1.4" marker-end="url(#sync)"/>

  <!-- m5: :MedicationController -> :AccessGuard (synchronous) -->
  <text x="760" y="301" font-size="10">canAccessPatient(user, patientId)</text>
  <line x1="755" y1="306" x2="975" y2="306" stroke="#000000" stroke-width="1.4" marker-end="url(#sync)"/>

  <!-- r6: return -->
  <text x="970" y="333" text-anchor="end" font-size="10" font-style="italic">true : Boolean</text>
  <line x1="975" y1="338" x2="755" y2="338" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/>

  <!-- m7: look for today's log first (idempotent per day) -->
  <text x="760" y="369" font-size="10">findTodaysLog(medId, dayStart, dayEnd)</text>
  <line x1="755" y1="374" x2="1195" y2="374" stroke="#000000" stroke-width="1.4" marker-end="url(#sync)"/>

  <!-- r8: return -->
  <text x="1190" y="403" text-anchor="end" font-size="10" font-style="italic">log or null</text>
  <line x1="1195" y1="408" x2="755" y2="408" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/>

  <!-- alt frame -->
  <rect x="690" y="436" width="780" height="324" fill="none" stroke="#000000" stroke-width="1.4"/>
  <path d="M690,436 H731 L738,443 V460 H690 Z" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="696" y="454" font-size="10" font-weight="bold">alt</text>
  <text x="762" y="454" font-size="10">[log exists today]</text>

  <!-- m9 -->
  <text x="760" y="475" font-size="10">save(status, takenAt)</text>
  <line x1="755" y1="480" x2="1195" y2="480" stroke="#000000" stroke-width="1.4" marker-end="url(#sync)"/>
  <!-- m10 -->
  <text x="1210" y="507" font-size="10">update(log)</text>
  <line x1="1205" y1="512" x2="1395" y2="512" stroke="#000000" stroke-width="1.4" marker-end="url(#sync)"/>
  <!-- r11 -->
  <text x="1390" y="539" text-anchor="end" font-size="10" font-style="italic">saved</text>
  <line x1="1395" y1="544" x2="1205" y2="544" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/>
  <!-- r12 -->
  <text x="1190" y="571" text-anchor="end" font-size="10" font-style="italic">log</text>
  <line x1="1195" y1="576" x2="755" y2="576" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/>

  <!-- operand divider -->
  <line x1="690" y1="600" x2="1470" y2="600" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="698" y="618" font-size="10">[else]</text>

  <!-- m13 -->
  <text x="760" y="635" font-size="10">create(medId, patientId, "taken")</text>
  <line x1="755" y1="640" x2="1195" y2="640" stroke="#000000" stroke-width="1.4" marker-end="url(#sync)"/>
  <!-- m14 -->
  <text x="1210" y="667" font-size="10">insert(log)</text>
  <line x1="1205" y1="672" x2="1395" y2="672" stroke="#000000" stroke-width="1.4" marker-end="url(#sync)"/>
  <!-- r15 -->
  <text x="1390" y="699" text-anchor="end" font-size="10" font-style="italic">saved</text>
  <line x1="1395" y1="704" x2="1205" y2="704" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/>
  <!-- r16 -->
  <text x="1190" y="731" text-anchor="end" font-size="10" font-style="italic">log</text>
  <line x1="1195" y1="736" x2="755" y2="736" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/>

  <!-- m17: asynchronous emit to the patient's own room -->
  <text x="760" y="789" font-size="10">emit("medication_update", patientRoom)</text>
  <line x1="755" y1="794" x2="1595" y2="794" stroke="#000000" stroke-width="1.4" marker-end="url(#open)"/>

  <!-- r18: HTTP response -->
  <text x="740" y="825" text-anchor="end" font-size="10" font-style="italic">201 { success, log }</text>
  <line x1="745" y1="830" x2="235" y2="830" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/>

  <!-- r19 -->
  <text x="220" y="861" text-anchor="end" font-size="10" font-style="italic">show status "Taken"</text>
  <line x1="225" y1="866" x2="80" y2="866" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/>
</svg>

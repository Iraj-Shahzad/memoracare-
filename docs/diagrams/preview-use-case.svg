<svg viewBox="0 0 1520 1200" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="openArrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#c2410c" stroke-width="1.4"/>
    </marker>
    <marker id="tri" markerWidth="16" markerHeight="16" refX="13" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,2 L13,7 L2,12 Z" fill="#fff" stroke="#334155" stroke-width="1.2"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1520" height="1200" fill="#ffffff"/>
  <text x="760" y="52" text-anchor="middle" font-size="30" font-weight="700" fill="#0f3d36">MemoryCare — Use Case Diagram</text>
  <text x="760" y="80" text-anchor="middle" font-size="14" fill="#64748b">Actors: Patient, Caregiver, System Manager (Admin), System</text>

  <!-- System boundary -->
  <rect x="350" y="150" width="800" height="1010" rx="10" fill="#f8fafb" stroke="#0d9488" stroke-width="2"/>
  <text x="750" y="180" text-anchor="middle" font-size="17" font-weight="700" fill="#0d9488">MemoryCare System</text>

  <!-- ================= ASSOCIATION LINES (drawn first, behind ellipses) ================= -->
  <g stroke="#94a3b8" stroke-width="1.3">
    <!-- Patient actor (130,340) to patient UCs (left vertex 448) -->
    <line x1="140" y1="340" x2="448" y2="200"/>
    <line x1="140" y1="340" x2="448" y2="260"/>
    <line x1="140" y1="340" x2="448" y2="320"/>
    <line x1="140" y1="340" x2="448" y2="380"/>
    <line x1="140" y1="340" x2="448" y2="440"/>
    <line x1="140" y1="340" x2="448" y2="500"/>
    <line x1="140" y1="340" x2="448" y2="560"/>
    <line x1="140" y1="340" x2="448" y2="620"/>
    <line x1="140" y1="340" x2="448" y2="680"/>
    <!-- Patient to shared (left vertex 678) -->
    <line x1="140" y1="340" x2="678" y2="340"/>
    <line x1="140" y1="340" x2="678" y2="430"/>
    <line x1="140" y1="340" x2="678" y2="520"/>
    <line x1="140" y1="340" x2="678" y2="610"/>
    <!-- Caregiver actor (130,900) to caregiver UCs -->
    <line x1="140" y1="900" x2="448" y2="800"/>
    <line x1="140" y1="900" x2="448" y2="860"/>
    <line x1="140" y1="900" x2="448" y2="920"/>
    <line x1="140" y1="900" x2="448" y2="980"/>
    <line x1="140" y1="900" x2="448" y2="1040"/>
    <line x1="140" y1="900" x2="448" y2="1100"/>
    <!-- Caregiver to shared -->
    <line x1="140" y1="900" x2="678" y2="340"/>
    <line x1="140" y1="900" x2="678" y2="520"/>
    <line x1="140" y1="900" x2="678" y2="610"/>
    <!-- Admin actor (1390,300) to admin UCs (right vertex 1092) -->
    <line x1="1380" y1="300" x2="1092" y2="220"/>
    <line x1="1380" y1="300" x2="1092" y2="280"/>
    <line x1="1380" y1="300" x2="1092" y2="340"/>
    <line x1="1380" y1="300" x2="1092" y2="400"/>
    <line x1="1380" y1="300" x2="1092" y2="460"/>
    <!-- Admin to shared (right vertex 862) -->
    <line x1="1380" y1="300" x2="862" y2="340"/>
    <line x1="1380" y1="300" x2="862" y2="520"/>
    <line x1="1380" y1="300" x2="862" y2="610"/>
    <!-- System actor (1390,820) to system UCs (right vertex 1092) -->
    <line x1="1380" y1="820" x2="1092" y2="640"/>
    <line x1="1380" y1="820" x2="1092" y2="700"/>
    <line x1="1380" y1="820" x2="1092" y2="760"/>
    <line x1="1380" y1="820" x2="1092" y2="820"/>
    <line x1="1380" y1="820" x2="1092" y2="880"/>
    <line x1="1380" y1="820" x2="1092" y2="940"/>
  </g>

  <!-- ================= INCLUDE / EXTEND (dashed) ================= -->
  <g stroke="#c2410c" stroke-width="1.4" stroke-dasharray="7 5" fill="none">
    <!-- Chat (632,440) include Classify Intent (908,700) -->
    <line x1="632" y1="440" x2="908" y2="700" marker-end="url(#openArrow)"/>
    <!-- Recognize Face (632,380) include Match Face (908,640) -->
    <line x1="632" y1="380" x2="908" y2="640" marker-end="url(#openArrow)"/>
    <!-- Voice Interaction (540,500) extend Chat (540,440) -->
    <path d="M470,490 C420,470 420,455 470,447" marker-end="url(#openArrow)"/>
    <!-- Detect Missed Dose (908,820) include Send Notification (908,880) -->
    <path d="M1000,845 C1050,855 1050,860 1000,872" marker-end="url(#openArrow)"/>
  </g>
  <g font-size="11" fill="#c2410c" font-style="italic" text-anchor="middle">
    <text x="775" y="565">«include»</text>
    <text x="745" y="505">«include»</text>
    <text x="405" y="463">«extend»</text>
    <text x="1063" y="862">«include»</text>
  </g>

  <!-- ================= USE CASE ELLIPSES ================= -->
  <g font-size="12.5" fill="#0f3d36" text-anchor="middle">
    <!-- Patient UCs -->
    <g>
      <ellipse cx="540" cy="200" rx="92" ry="25" fill="#ffffff" stroke="#0d9488" stroke-width="1.6"/><text x="540" y="205">View Dashboard</text>
      <ellipse cx="540" cy="260" rx="92" ry="25" fill="#ffffff" stroke="#0d9488" stroke-width="1.6"/><text x="540" y="265">Take Medication</text>
      <ellipse cx="540" cy="320" rx="92" ry="25" fill="#ffffff" stroke="#0d9488" stroke-width="1.6"/><text x="540" y="325">Complete Routine</text>
      <ellipse cx="540" cy="380" rx="92" ry="25" fill="#ffffff" stroke="#0d9488" stroke-width="1.6"/><text x="540" y="385">Recognize Face</text>
      <ellipse cx="540" cy="440" rx="92" ry="25" fill="#ffffff" stroke="#0d9488" stroke-width="1.6"/><text x="540" y="445">Chat with Assistant</text>
      <ellipse cx="540" cy="500" rx="92" ry="25" fill="#ffffff" stroke="#0d9488" stroke-width="1.6"/><text x="540" y="505">Voice Interaction</text>
      <ellipse cx="540" cy="560" rx="92" ry="25" fill="#ffffff" stroke="#0d9488" stroke-width="1.6"/><text x="540" y="565">View Memory Gallery</text>
      <ellipse cx="540" cy="620" rx="92" ry="25" fill="#ffffff" stroke="#0d9488" stroke-width="1.6"/><text x="540" y="625">View Activity Log</text>
      <ellipse cx="540" cy="680" rx="92" ry="25" fill="#ffffff" stroke="#0d9488" stroke-width="1.6"/><text x="540" y="685">Trigger SOS Alert</text>
    </g>
    <!-- Caregiver UCs -->
    <g>
      <ellipse cx="540" cy="800" rx="92" ry="25" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><text x="540" y="797">Manage Assigned</text><text x="540" y="811">Patients</text>
      <ellipse cx="540" cy="860" rx="92" ry="25" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><text x="540" y="865">Manage Medications</text>
      <ellipse cx="540" cy="920" rx="92" ry="25" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><text x="540" y="925">Manage Routines</text>
      <ellipse cx="540" cy="980" rx="92" ry="25" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><text x="540" y="985">Enroll Known Faces</text>
      <ellipse cx="540" cy="1040" rx="92" ry="25" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><text x="540" y="1037">View &amp; Resolve</text><text x="540" y="1051">Alerts</text>
      <ellipse cx="540" cy="1100" rx="92" ry="25" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><text x="540" y="1105">Manage Care Notes</text>
    </g>
    <!-- Shared UCs -->
    <g>
      <ellipse cx="770" cy="340" rx="92" ry="25" fill="#fffdf5" stroke="#b45309" stroke-width="1.6"/><text x="770" y="345">Register / Login</text>
      <ellipse cx="770" cy="430" rx="92" ry="25" fill="#fffdf5" stroke="#b45309" stroke-width="1.6"/><text x="770" y="435">Manage Profile</text>
      <ellipse cx="770" cy="520" rx="92" ry="25" fill="#fffdf5" stroke="#b45309" stroke-width="1.6"/><text x="770" y="517">Generate &amp; Download</text><text x="770" y="531">Report</text>
      <ellipse cx="770" cy="610" rx="92" ry="25" fill="#fffdf5" stroke="#b45309" stroke-width="1.6"/><text x="770" y="615">Logout</text>
    </g>
    <!-- Admin UCs -->
    <g>
      <ellipse cx="1000" cy="220" rx="92" ry="25" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><text x="1000" y="225">Manage Users</text>
      <ellipse cx="1000" cy="280" rx="92" ry="25" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><text x="1000" y="285">Monitor System</text>
      <ellipse cx="1000" cy="340" rx="92" ry="25" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><text x="1000" y="345">Manage Security</text>
      <ellipse cx="1000" cy="400" rx="92" ry="25" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><text x="1000" y="397">View Contact</text><text x="1000" y="411">Messages</text>
      <ellipse cx="1000" cy="460" rx="92" ry="25" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><text x="1000" y="465">View Statistics</text>
    </g>
    <!-- System UCs -->
    <g>
      <ellipse cx="1000" cy="640" rx="92" ry="25" fill="#f4fbfa" stroke="#0891b2" stroke-width="1.6"/><text x="1000" y="645">Match Face</text>
      <ellipse cx="1000" cy="700" rx="92" ry="25" fill="#f4fbfa" stroke="#0891b2" stroke-width="1.6"/><text x="1000" y="705">Classify Intent</text>
      <ellipse cx="1000" cy="760" rx="92" ry="25" fill="#f4fbfa" stroke="#0891b2" stroke-width="1.6"/><text x="1000" y="765">Send Reminder</text>
      <ellipse cx="1000" cy="820" rx="92" ry="25" fill="#f4fbfa" stroke="#0891b2" stroke-width="1.6"/><text x="1000" y="825">Detect Missed Dose</text>
      <ellipse cx="1000" cy="880" rx="92" ry="25" fill="#f4fbfa" stroke="#0891b2" stroke-width="1.6"/><text x="1000" y="885">Send Notification</text>
      <ellipse cx="1000" cy="940" rx="92" ry="25" fill="#f4fbfa" stroke="#0891b2" stroke-width="1.6"/><text x="1000" y="945">Store Data</text>
    </g>
  </g>

  <!-- ================= ACTORS ================= -->
  <g stroke="#0f3d36" stroke-width="2" fill="none">
    <!-- Patient -->
    <circle cx="110" cy="315" r="12"/><line x1="110" y1="327" x2="110" y2="360"/><line x1="88" y1="340" x2="132" y2="340"/><line x1="110" y1="360" x2="92" y2="388"/><line x1="110" y1="360" x2="128" y2="388"/>
    <!-- Caregiver -->
    <circle cx="110" cy="875" r="12"/><line x1="110" y1="887" x2="110" y2="920"/><line x1="88" y1="900" x2="132" y2="900"/><line x1="110" y1="920" x2="92" y2="948"/><line x1="110" y1="920" x2="128" y2="948"/>
    <!-- Admin -->
    <circle cx="1410" cy="275" r="12"/><line x1="1410" y1="287" x2="1410" y2="320"/><line x1="1388" y1="300" x2="1432" y2="300"/><line x1="1410" y1="320" x2="1392" y2="348"/><line x1="1410" y1="320" x2="1428" y2="348"/>
    <!-- System -->
    <circle cx="1410" cy="795" r="12"/><line x1="1410" y1="807" x2="1410" y2="840"/><line x1="1388" y1="820" x2="1432" y2="820"/><line x1="1410" y1="840" x2="1392" y2="868"/><line x1="1410" y1="840" x2="1428" y2="868"/>
  </g>
  <g font-size="14" font-weight="700" fill="#0f3d36" text-anchor="middle">
    <text x="110" y="408">Patient</text>
    <text x="110" y="968">Caregiver</text>
    <text x="1410" y="368">System Manager</text>
    <text x="1410" y="386" font-size="11" font-weight="400" fill="#64748b">(Admin)</text>
    <text x="1410" y="888">System</text>
    <text x="1410" y="760" font-size="11" font-weight="400" font-style="italic" fill="#64748b">«system»</text>
  </g>

  <!-- ================= LEGEND ================= -->
  <g font-size="12" fill="#334155">
    <rect x="360" y="1075" width="290" height="72" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="372" y="1095" font-weight="700" fill="#0f3d36">Legend</text>
    <line x1="372" y1="1112" x2="410" y2="1112" stroke="#94a3b8" stroke-width="1.3"/><text x="418" y="1116">association</text>
    <line x1="530" y1="1112" x2="568" y2="1112" stroke="#c2410c" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#openArrow)"/><text x="576" y="1116" fill="#c2410c">«include»/«extend»</text>
    <text x="372" y="1138" fill="#64748b">Colours group use cases by actor only.</text>
  </g>
</svg>

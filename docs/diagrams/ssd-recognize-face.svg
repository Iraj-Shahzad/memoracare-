<svg xmlns="http://www.w3.org/2000/svg" viewBox="-5 -5 940 610" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="sync" markerWidth="14" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11 z" fill="#000000"/>
    </marker>
    <marker id="ret" markerWidth="16" markerHeight="14" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#000000" stroke-width="1.4"/>
    </marker>
    <marker id="async" markerWidth="16" markerHeight="14" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L11,6 L1,11" fill="none" stroke="#000000" stroke-width="1.1"/>
    </marker>
  </defs>
  <rect x="-5" y="-5" width="940" height="610" fill="#ffffff"/>

  <!-- diagram frame + tab -->
  <rect x="15" y="15" width="885" height="570" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <path d="M15,15 H145 V31 L137,39 H15 Z" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="23" y="31" font-weight="bold">sd  Recognize Face</text>

  <!-- lifelines -->
  <line x1="110" y1="152" x2="110" y2="575" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/>
  <line x1="490" y1="126" x2="490" y2="575" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/>
  <line x1="760" y1="152" x2="760" y2="575" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/>

  <!-- Patient actor -->
  <circle cx="110" cy="59" r="8" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <line x1="110" y1="67" x2="110" y2="93" stroke="#000000" stroke-width="1.4"/>
  <line x1="93" y1="75" x2="127" y2="75" stroke="#000000" stroke-width="1.4"/>
  <line x1="110" y1="93" x2="97" y2="117" stroke="#000000" stroke-width="1.4"/>
  <line x1="110" y1="93" x2="123" y2="117" stroke="#000000" stroke-width="1.4"/>
  <text x="110" y="133" text-anchor="middle" font-weight="bold">Patient</text>

  <!-- system -->
  <rect x="430" y="86" width="120" height="40" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="490" y="111" text-anchor="middle" font-weight="bold">:System</text>

  <!-- Caregiver actor -->
  <circle cx="760" cy="59" r="8" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <line x1="760" y1="67" x2="760" y2="93" stroke="#000000" stroke-width="1.4"/>
  <line x1="743" y1="75" x2="777" y2="75" stroke="#000000" stroke-width="1.4"/>
  <line x1="760" y1="93" x2="747" y2="117" stroke="#000000" stroke-width="1.4"/>
  <line x1="760" y1="93" x2="773" y2="117" stroke="#000000" stroke-width="1.4"/>
  <text x="760" y="133" text-anchor="middle" font-weight="bold">Caregiver</text>

  <!-- UML note attached to captureFace -->
  <path d="M120,160 H366 L380,174 V236 H120 Z" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <path d="M366,160 V174 H380" fill="none" stroke="#000000" stroke-width="1.4"/>
  <text x="128" y="180" font-size="11">{ face matching runs in the browser</text>
  <text x="128" y="196" font-size="11">with face-api.js, 128 value</text>
  <text x="128" y="212" font-size="11">descriptors, 0.6 distance threshold }</text>
  <line x1="180" y1="236" x2="180" y2="290" stroke="#000000" stroke-width="1.4" stroke-dasharray="4 4"/>

  <!-- activation bar on :System, reaching the bottom of the alt frame -->
  <rect x="485" y="290" width="10" height="265" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>

  <!-- alt frame + pentagon operator tab + guard -->
  <rect x="78" y="325" width="782" height="230" fill="none" stroke="#000000" stroke-width="1.4"/>
  <path d="M78,325 H120 V337 L114,343 H78 Z" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <text x="84" y="338" font-size="11" font-weight="bold">alt</text>
  <text x="126" y="338" font-size="11">[face recognized]</text>

  <!-- operand separator + second guard -->
  <line x1="78" y1="430" x2="860" y2="430" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="140" y="448" font-size="11">[unknown]</text>

  <!-- m1 synchronous call -->
  <text x="297" y="285" text-anchor="middle">captureFace(patientId, image)</text>
  <line x1="110" y1="290" x2="485" y2="290" stroke="#000000" stroke-width="1.4" marker-end="url(#sync)"/>

  <!-- m2 return (recognized) -->
  <text x="297" y="390" text-anchor="middle" font-style="italic">personInfo(name, relationship, confidence)</text>
  <line x1="485" y1="395" x2="110" y2="395" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ret)"/>

  <!-- m3 return (unknown) -->
  <text x="297" y="475" text-anchor="middle" font-style="italic">unknownPerson</text>
  <line x1="485" y1="480" x2="110" y2="480" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ret)"/>

  <!-- m4 asynchronous alert to the Caregiver -->
  <text x="625" y="515" text-anchor="middle">alert(face_unknown, warning, message)</text>
  <line x1="495" y1="520" x2="755" y2="520" stroke="#000000" stroke-width="1.4" marker-end="url(#async)"/>
</svg>

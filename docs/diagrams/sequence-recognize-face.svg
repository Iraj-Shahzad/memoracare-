  <text x="1184" y="544" text-anchor="end" font-size="20" font-style="italic">log</text>
  <line x1="1190" y1="550" x2="798" y2="550" stroke="#000000" stroke-width="2" stroke-dasharray="" marker-end="url(#open)"/>
  <!-- m13 : sync -->
  <rect x="801" y="617" width="638.1" height="22" fill="#ffffff"/>
  <text x="806" y="634" font-size="20">findByIdAndUpdate(knownFaceId, { $inc: recognitionCount, lastSeen })</text>
  <line x1="798" y1="640" x2="1358" y2="640" stroke="#000000" stroke-width="2" marker-end="url(#sync)"/>
  <!-- m14 : ret -->
  <rect x="1274.7" y="647" width="82.3" height="22" fill="#ffffff"/>
  <text x="1352" y="664" text-anchor="end" font-size="20" font-style="italic">updated</text>
  <line x1="1358" y1="670" x2="798" y2="670" stroke="#000000" stroke-width="2" stroke-dasharray="" marker-end="url(#open)"/>
  <!-- m15 : ret -->
  <rect x="291.4" y="677" width="493.6" height="22" fill="#ffffff"/>
  <text x="780" y="694" text-anchor="end" font-size="20" font-style="italic">200 { recognition: log(name, relationship, confidence) }</text>
  <line x1="786" y1="700" x2="226" y2="700" stroke="#000000" stroke-width="2" stroke-dasharray="" marker-end="url(#open)"/>
  <!-- m16 : ret -->
  <rect x="53" y="707" width="333.5" height="22" fill="#ffffff"/>
  <text x="58" y="724" font-size="20" font-style="italic">show name, relationship, confidence</text>
  <line x1="214" y1="730" x2="52" y2="730" stroke="#000000" stroke-width="2" stroke-dasharray="" marker-end="url(#open)"/>
  <!-- m17 : sync -->
  <rect x="801" y="791" width="470.8" height="22" fill="#ffffff"/>
  <text x="806" y="808" font-size="20">create({ type: "face_unknown", severity: "warning" })</text>
  <line x1="798" y1="814" x2="1482" y2="814" stroke="#000000" stroke-width="2" marker-end="url(#sync)"/>
  <!-- m18 : ret -->
  <rect x="1432.1" y="821" width="48.9000000000001" height="22" fill="#ffffff"/>
  <text x="1476" y="838" text-anchor="end" font-size="20" font-style="italic">alert</text>
  <line x1="1482" y1="844" x2="798" y2="844" stroke="#000000" stroke-width="2" stroke-dasharray="" marker-end="url(#open)"/>
  <!-- m19 : async -->
  <rect x="801" y="851" width="270.9" height="22" fill="#ffffff"/>
  <text x="806" y="868" font-size="20">emit("alert", caregiverRooms)</text>
  <line x1="798" y1="874" x2="1630" y2="874" stroke="#000000" stroke-width="2" marker-end="url(#open)"/>
  <!-- m20 : async -->
  <rect x="1514.7" y="881" width="272.3" height="22" fill="#ffffff"/>
  <text x="1782" y="898" text-anchor="end" font-size="20">alert(face_unknown, warning)</text>
  <line x1="1642" y1="904" x2="1790" y2="904" stroke="#000000" stroke-width="2" marker-end="url(#open)"/>
  <!-- m21 : ret -->
  <rect x="408.4" y="911" width="376.6" height="22" fill="#ffffff"/>
  <text x="780" y="928" text-anchor="end" font-size="20" font-style="italic">200 { recognition: log(result: "unknown") }</text>
  <line x1="786" y1="934" x2="226" y2="934" stroke="#000000" stroke-width="2" stroke-dasharray="" marker-end="url(#open)"/>
  <!-- m22 : ret -->

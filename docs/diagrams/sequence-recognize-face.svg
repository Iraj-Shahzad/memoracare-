  <text x="114" y="599" font-size="19">[recognized]</text>
  <text x="38" y="782" font-size="19">[unknown]</text>

  <!-- m1 : sync -->
  <rect x="55" y="157" width="154.5" height="22" fill="#ffffff"/>
  <text x="60" y="174" font-size="20">handleCapture()</text>
  <line x1="52" y1="180" x2="214" y2="180" stroke="#000000" stroke-width="2" marker-end="url(#sync)"/>
  <!-- m2 : sync -->
  <rect x="229" y="189" width="342.4" height="22" fill="#ffffff"/>
  <text x="234" y="206" font-size="20">getAveragedDescriptor(video, 3, 120)</text>
  <line x1="226" y1="212" x2="392" y2="212" stroke="#000000" stroke-width="2" marker-end="url(#sync)"/>
  <!-- m3 : ret -->
  <rect x="152" y="219" width="239" height="22" fill="#ffffff"/>
  <text x="386" y="236" text-anchor="end" font-size="20" font-style="italic">probe : Float32Array(128)</text>
  <line x1="392" y1="242" x2="226" y2="242" stroke="#000000" stroke-width="2" stroke-dasharray="" marker-end="url(#open)"/>
  <!-- m4 : sync -->
  <rect x="229" y="251" width="363.5" height="22" fill="#ffffff"/>
  <text x="234" y="268" font-size="20">findBestMatch(probe, knownFaces, 0.6)</text>
  <line x1="226" y1="274" x2="392" y2="274" stroke="#000000" stroke-width="2" marker-end="url(#sync)"/>
  <!-- m5 : ret -->
  <rect x="227" y="281" width="442.4" height="22" fill="#ffffff"/>
  <text x="232" y="298" font-size="20" font-style="italic">match { knownFaceId, name, confidence } or null</text>
  <line x1="392" y1="304" x2="226" y2="304" stroke="#000000" stroke-width="2" stroke-dasharray="" marker-end="url(#open)"/>
  <!-- m6 : sync -->
  <rect x="229" y="313" width="801.5" height="22" fill="#ffffff"/>
  <text x="234" y="330" font-size="20">POST /face-recognition/recognize { result, name, relationship, confidence, knownFaceId }</text>
  <line x1="226" y1="336" x2="544" y2="336" stroke="#000000" stroke-width="2" marker-end="url(#sync)"/>
  <!-- m7 : self -->
  <rect x="627" y="371" width="201.2" height="22" fill="#ffffff"/>
  <text x="632" y="388" font-size="20">protect(req, res, next)</text>

  <line x1="798" y1="458" x2="1014" y2="458" stroke="#000000" stroke-width="2" marker-end="url(#sync)"/>
  <!-- m10 : ret -->
  <rect x="878.5" y="465" width="134.5" height="22" fill="#ffffff"/>
  <text x="1008" y="482" text-anchor="end" font-size="20" font-style="italic">true : Boolean</text>
  <line x1="1014" y1="488" x2="798" y2="488" stroke="#000000" stroke-width="2" stroke-dasharray="" marker-end="url(#open)"/>
  <!-- m11 : sync -->
  <rect x="801" y="497" width="594.7" height="22" fill="#ffffff"/>
  <text x="806" y="514" font-size="20">create({ patient, result, recognizedPerson, confidence, imageUrl })</text>
  <line x1="798" y1="520" x2="1190" y2="520" stroke="#000000" stroke-width="2" marker-end="url(#sync)"/>
  <!-- m12 : ret -->

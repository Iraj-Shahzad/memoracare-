<svg viewBox="0 0 1120 700" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="oa" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#000" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="700" fill="#ffffff"/>

  <rect x="190" y="100" width="800" height="540" fill="none" stroke="#000" stroke-width="1.6"/>
  <text x="560" y="122" text-anchor="middle" font-size="15" font-weight="700">MemoryCare System</text>

  <!-- ===== association lines : orthogonal channel routing =====
       every run travels only in an empty channel, so no line can cross an ellipse it
       does not terminate on.
       vertical channels  : x = 215, 245 (left margin) | 415, 428 (col A|B)
                            585, 612 (col B|C) | 790, 815 (col C|D) | 980, 1000, 1004 (right)
       horizontal channels: y = 185, 334, 408, 420, 500, 564 (empty gaps between rows) -->
  <g stroke="#666666" stroke-width="1.1" fill="none">
    <!-- Patient : trunk 215, then 415 for column B, then 612 for the shared group -->
    <polyline points="118,207 215,207 215,159 270,159"/>
    <polyline points="118,207 215,207 215,229 270,229"/>
    <polyline points="118,207 215,207 215,299 270,299"/>
    <polyline points="118,207 215,207 215,369 270,369"/>
    <polyline points="118,207 215,207 215,130 415,130 415,159 440,159"/>
    <polyline points="118,207 215,207 215,130 415,130 415,229 440,229"/>
    <polyline points="118,207 215,207 215,130 415,130 415,299 440,299"/>
    <polyline points="118,207 215,207 215,130 415,130 415,369 440,369"/>
    <polyline points="118,207 215,207 215,130 415,130 415,461 440,461"/>
    <polyline points="118,207 215,207 215,130 415,130 415,334 612,334 612,369 630,369"/>
    <polyline points="118,207 215,207 215,130 415,130 415,334 612,334 612,461 630,461"/>
    <polyline points="118,207 215,207 215,130 415,130 415,334 612,334 612,529 625,529"/>
    <!-- Caregiver : trunk 245, then 428 for column B, then 585 for the shared group -->
    <polyline points="118,497 245,497 245,461 270,461"/>
    <polyline points="118,497 245,497 245,529 270,529"/>
    <polyline points="118,497 245,497 245,599 270,599"/>
    <polyline points="118,497 428,497 428,529 440,529"/>
    <polyline points="118,497 428,497 428,599 440,599"/>
    <polyline points="118,497 428,497 428,564 585,564 585,408 695,408 695,388"/>
    <polyline points="118,497 428,497 428,564 585,564 585,500 695,500 695,480"/>
    <polyline points="118,497 428,497 428,564 695,564 695,548"/>
    <!-- Admin : trunk 980, then 790 for the shared group -->
    <polyline points="1012,212 980,212 980,159 965,159"/>
    <polyline points="1012,212 980,212 980,229 965,229"/>
    <polyline points="1012,212 980,212 980,299 965,299"/>
    <polyline points="1012,212 980,212 980,369 970,369"/>
    <polyline points="1012,212 980,212 980,461 970,461"/>
    <polyline points="1012,212 980,212 980,420 790,420 790,369 760,369"/>
    <polyline points="1012,212 980,212 980,420 790,420 790,529 765,529"/>
    <!-- Time -->
    <polyline points="1012,511 1000,511 1000,529 965,529"/>
    <polyline points="1012,511 1000,511 1000,599 965,599"/>
    <!-- Wit.ai (routed up the column C|D gap) -->
    <polyline points="1012,376 1004,376 1004,334 815,334 815,159 760,159"/>
  </g>

  <!-- ===== include / extend ===== -->
  <g stroke="#000" stroke-width="1.2" stroke-dasharray="6 4" fill="none">
    <line x1="389.12" y1="169.523" x2="640.88" y2="218.477" marker-end="url(#oa)"/>
    <line x1="389.12" y1="218.477" x2="640.88" y2="169.523" marker-end="url(#oa)"/>
    <line x1="695" y1="350" x2="695" y2="318" marker-end="url(#oa)"/>
    <line x1="467.374" y1="174.493" x2="372.626" y2="213.507" marker-end="url(#oa)"/>
  </g>
  <g font-size="10" font-style="italic">
    <rect x="578" y="211" width="46" height="12" fill="#fff"/><text x="580" y="220" text-anchor="start">&#171;include&#187;</text>
    <rect x="448" y="196" width="46" height="12" fill="#fff"/><text x="450" y="205" text-anchor="start">&#171;include&#187;</text>
    <rect x="717" y="328" width="46" height="12" fill="#fff"/><text x="740" y="337" text-anchor="middle">&#171;include&#187;</text>
    <text x="398" y="190" text-anchor="end">&#171;extend&#187;</text>
  </g>

  <!-- ===== ellipses ===== -->
  <g font-size="11" text-anchor="middle">
    <!-- C1 -->
    <ellipse cx="335" cy="159" rx="65" ry="19" fill="#fff" stroke="#000"/><text x="335" y="163">Recognize Face</text>
    <ellipse cx="335" cy="229" rx="65" ry="19" fill="#fff" stroke="#000"/><text x="335" y="233">Chat with Assistant</text>
    <ellipse cx="335" cy="299" rx="65" ry="19" fill="#fff" stroke="#000"/><text x="335" y="303">Take Medication</text>
    <ellipse cx="335" cy="369" rx="65" ry="19" fill="#fff" stroke="#000"/><text x="335" y="373">Complete Routine</text>
    <ellipse cx="335" cy="461" rx="65" ry="21" fill="#fff" stroke="#000"/><text x="335" y="458">Manage Assigned</text><text x="335" y="470">Patients</text>
    <ellipse cx="335" cy="529" rx="65" ry="19" fill="#fff" stroke="#000"/><text x="335" y="533">Manage Medications</text>
    <ellipse cx="335" cy="599" rx="65" ry="19" fill="#fff" stroke="#000"/><text x="335" y="603">Manage Routines</text>
    <!-- C2 -->
    <ellipse cx="505" cy="159" rx="65" ry="19" fill="#fff" stroke="#000"/><text x="505" y="163">Voice Interaction</text>
    <ellipse cx="505" cy="229" rx="65" ry="19" fill="#fff" stroke="#000"/><text x="505" y="233">View Memory Gallery</text>
    <ellipse cx="505" cy="299" rx="65" ry="19" fill="#fff" stroke="#000"/><text x="505" y="303">View Activity Log</text>
    <ellipse cx="505" cy="369" rx="65" ry="19" fill="#fff" stroke="#000"/><text x="505" y="373">Trigger SOS Alert</text>
    <ellipse cx="505" cy="461" rx="65" ry="21" fill="#fff" stroke="#000"/><text x="505" y="465">Enroll Known Faces</text>
    <ellipse cx="505" cy="529" rx="65" ry="19" fill="#fff" stroke="#000"/><text x="505" y="533">View &amp; Resolve Alerts</text>
    <ellipse cx="505" cy="599" rx="65" ry="19" fill="#fff" stroke="#000"/><text x="505" y="603">Manage Care Notes</text>
    <!-- C3 : included use cases + the shared group (rows 4 to 6) -->
    <ellipse cx="695" cy="159" rx="65" ry="19" fill="#fff" stroke="#000"/><text x="695" y="163">Classify Intent</text>
    <ellipse cx="695" cy="229" rx="65" ry="19" fill="#fff" stroke="#000"/><text x="695" y="233">Match Face</text>
    <ellipse cx="695" cy="299" rx="65" ry="19" fill="#fff" stroke="#000"/><text x="695" y="303">Validate Credentials</text>
    <ellipse cx="695" cy="369" rx="65" ry="19" fill="#fff" stroke="#000"/><text x="695" y="373">Register / Login</text>
    <ellipse cx="695" cy="461" rx="65" ry="19" fill="#fff" stroke="#000"/><text x="695" y="465">Manage Profile</text>
    <ellipse cx="695" cy="529" rx="70" ry="19" fill="#fff" stroke="#000"/><text x="695" y="526">Generate &amp;</text><text x="695" y="538">Download Report</text>
    <!-- C4 -->
    <ellipse cx="900" cy="159" rx="65" ry="19" fill="#fff" stroke="#000"/><text x="900" y="163">Manage Users</text>
    <ellipse cx="900" cy="229" rx="65" ry="19" fill="#fff" stroke="#000"/><text x="900" y="233">Monitor System</text>
    <ellipse cx="900" cy="299" rx="65" ry="19" fill="#fff" stroke="#000"/><text x="900" y="303">Manage Security</text>
    <ellipse cx="900" cy="369" rx="70" ry="19" fill="#fff" stroke="#000"/><text x="900" y="373">View Contact Messages</text>
    <ellipse cx="900" cy="461" rx="70" ry="19" fill="#fff" stroke="#000"/><text x="900" y="465">View System Statistics</text>
    <ellipse cx="900" cy="529" rx="65" ry="19" fill="#fff" stroke="#000"/><text x="900" y="533">Send Reminder</text>
    <ellipse cx="900" cy="599" rx="65" ry="19" fill="#fff" stroke="#000"/><text x="900" y="603">Send Notification</text>
  </g>

  <!-- ===== actors ===== -->
  <g stroke="#000" stroke-width="1.6" fill="none">
    <!-- Patient -->
    <circle cx="94" cy="188" r="9"/><line x1="94" y1="197" x2="94" y2="225"/><line x1="80" y1="206" x2="108" y2="206"/><line x1="94" y1="225" x2="82" y2="250"/><line x1="94" y1="225" x2="106" y2="250"/>
    <!-- Caregiver -->
    <circle cx="94" cy="478" r="9"/><line x1="94" y1="487" x2="94" y2="515"/><line x1="80" y1="496" x2="108" y2="496"/><line x1="94" y1="515" x2="82" y2="540"/><line x1="94" y1="515" x2="106" y2="540"/>
    <!-- Admin -->
    <circle cx="1036" cy="193" r="9"/><line x1="1036" y1="202" x2="1036" y2="230"/><line x1="1022" y1="211" x2="1050" y2="211"/><line x1="1036" y1="230" x2="1024" y2="255"/><line x1="1036" y1="230" x2="1048" y2="255"/>
    <!-- Time -->
    <circle cx="1036" cy="493" r="9"/><line x1="1036" y1="502" x2="1036" y2="530"/><line x1="1022" y1="511" x2="1050" y2="511"/><line x1="1036" y1="530" x2="1024" y2="555"/><line x1="1036" y1="530" x2="1048" y2="555"/>
    <!-- Wit.ai (right) -->
    <circle cx="1036" cy="358" r="9"/><line x1="1036" y1="367" x2="1036" y2="395"/><line x1="1022" y1="376" x2="1050" y2="376"/><line x1="1036" y1="395" x2="1024" y2="420"/><line x1="1036" y1="395" x2="1048" y2="420"/>
  </g>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <text x="94" y="270">Patient</text>
    <text x="94" y="560">Caregiver</text>
    <text x="1036" y="277">Admin</text>
    <text x="1036" y="597">Time</text>
    <text x="1036" y="583" font-size="10" font-weight="400" font-style="italic">&#171;time&#187;</text>
    <text x="1036" y="437" font-size="10" font-weight="400" font-style="italic">&#171;system&#187;</text>
    <text x="1036" y="450" font-size="11" font-weight="400">Wit.ai NLU</text>
    <text x="1036" y="462" font-size="10" font-weight="400">(Supporting)</text>
  </g>

  <text x="190" y="672" font-size="11" font-style="italic">Association = solid line&#160;&#160;|&#160;&#160;&#171;include&#187; base&#8594;inclusion, &#171;extend&#187; extension&#8594;base = dashed open arrow</text>
</svg>

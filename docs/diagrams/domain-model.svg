    <rect x="988" y="440" width="140" height="80" fill="#fff" stroke="#000"/><text x="1058" y="456" text-anchor="middle" font-weight="700">Reminder</text><line x1="988" y1="463" x2="1128" y2="463" stroke="#000"/>

<svg viewBox="0 0 1790 740" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1790" height="740" fill="#ffffff"/>
  <text x="40" y="30" font-size="20" font-weight="700">MemoryCare — Domain Model</text>

  <!-- ===== association lines ===== -->
  <g stroke="#555" stroke-width="1.2" fill="none">
    <!-- fan from Patient (835,320) -->
    <line x1="835" y1="320" x2="110" y2="440"/>
    <line x1="835" y1="320" x2="268" y2="440"/>
    <line x1="835" y1="320" x2="426" y2="440"/>
    <line x1="835" y1="320" x2="584" y2="440"/>
    <line x1="835" y1="320" x2="742" y2="440"/>
    <line x1="835" y1="320" x2="900" y2="440"/>
    <line x1="835" y1="320" x2="1058" y2="440"/>
    <line x1="835" y1="320" x2="1216" y2="440"/>
    <line x1="835" y1="320" x2="1374" y2="440"/>
    <line x1="835" y1="320" x2="1532" y2="440"/>
    <line x1="835" y1="320" x2="1690" y2="440"/>
    <!-- chains + others -->
    <line x1="1532" y1="534" x2="1532" y2="620"/>
    <line x1="1690" y1="550" x2="1690" y2="620"/>
    <polyline points="584,520 505,556 426,520"/>
    <line x1="190" y1="126" x2="760" y2="250"/>
    <line x1="115" y1="146" x2="115" y2="440"/>
    <line x1="1565" y1="130" x2="1565" y2="200"/>
  </g>

  <!-- ===== generalization ===== -->
  <g stroke="#000" stroke-width="1.3" fill="none">
    <line x1="835" y1="210" x2="835" y2="134"/>
    <line x1="190" y1="110" x2="760" y2="90"/>
    <line x1="1490" y1="110" x2="910" y2="90"/>
  </g>
  <path d="M827,134 L843,134 L835,120 Z" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <path d="M760,79 L760,95 L746,87 Z" fill="#fff" stroke="#000" stroke-width="1.3"/>
  <path d="M910,79 L910,95 L924,87 Z" fill="#fff" stroke="#000" stroke-width="1.3"/>

  <!-- ===== boxes ===== -->
  <g font-size="11">
    <!-- User -->
    <rect x="760" y="40" width="150" height="94" fill="#fff" stroke="#000"/><text x="835" y="56" text-anchor="middle" font-weight="700">User</text><line x1="760" y1="63" x2="910" y2="63" stroke="#000"/>
    <text x="768" y="79">name</text><text x="768" y="94">email</text><text x="768" y="109">phone</text><text x="768" y="124">role</text>
    <!-- Patient -->
    <rect x="760" y="210" width="150" height="110" fill="#fff" stroke="#000"/><text x="835" y="226" text-anchor="middle" font-weight="700">Patient</text><line x1="760" y1="233" x2="910" y2="233" stroke="#000"/>
    <text x="768" y="249">dateOfBirth</text><text x="768" y="264">gender</text><text x="768" y="279">diagnosis</text><text x="768" y="294">city</text><text x="768" y="309">doctor</text>
    <!-- Caregiver -->
    <rect x="40" y="90" width="150" height="56" fill="#fff" stroke="#000"/><text x="115" y="106" text-anchor="middle" font-weight="700">Caregiver</text><line x1="40" y1="113" x2="190" y2="113" stroke="#000"/>
    <text x="48" y="129">specialization</text>
    <!-- Administrator -->
    <rect x="1490" y="90" width="150" height="40" fill="#fff" stroke="#000"/><text x="1565" y="114" text-anchor="middle" font-weight="700">Administrator</text>
    <!-- Contact -->
    <rect x="1490" y="200" width="150" height="110" fill="#fff" stroke="#000"/><text x="1565" y="216" text-anchor="middle" font-weight="700">Contact</text><line x1="1490" y1="223" x2="1640" y2="223" stroke="#000"/>
    <text x="1498" y="239">name</text><text x="1498" y="254">email</text><text x="1498" y="269">subject</text><text x="1498" y="284">message</text><text x="1498" y="299">status</text>
    <!-- Note -->
    <rect x="40" y="440" width="140" height="64" fill="#fff" stroke="#000"/><text x="110" y="456" text-anchor="middle" font-weight="700">Note</text><line x1="40" y1="463" x2="180" y2="463" stroke="#000"/>
    <text x="48" y="479">content</text><text x="48" y="494">category</text>
    <!-- EmergencyContact -->
    <rect x="198" y="440" width="140" height="80" fill="#fff" stroke="#000"/><text x="268" y="456" text-anchor="middle" font-weight="700" font-size="10">EmergencyContact</text><line x1="198" y1="463" x2="338" y2="463" stroke="#000"/>
    <text x="206" y="479">name</text><text x="206" y="494">relationship</text><text x="206" y="509">phone</text>
    <!-- KnownFace -->
    <rect x="356" y="440" width="140" height="80" fill="#fff" stroke="#000"/><text x="426" y="456" text-anchor="middle" font-weight="700">KnownFace</text><line x1="356" y1="463" x2="496" y2="463" stroke="#000"/>
    <text x="364" y="479">name</text><text x="364" y="494">relationship</text><text x="364" y="509">photo</text>
    <!-- RecognitionLog -->
    <rect x="514" y="440" width="140" height="80" fill="#fff" stroke="#000"/><text x="584" y="456" text-anchor="middle" font-weight="700" font-size="10">RecognitionLog</text><line x1="514" y1="463" x2="654" y2="463" stroke="#000"/>
    <text x="522" y="479">result</text><text x="522" y="494">confidence</text><text x="522" y="509">dateTime</text>
    <!-- Memory -->
    <rect x="672" y="440" width="140" height="110" fill="#fff" stroke="#000"/><text x="742" y="456" text-anchor="middle" font-weight="700">Memory</text><line x1="672" y1="463" x2="812" y2="463" stroke="#000"/>
    <text x="680" y="479">title</text><text x="680" y="494">description</text><text x="680" y="509">photo</text><text x="680" y="524">date</text><text x="680" y="539">location</text>
    <!-- ChatHistory -->
    <rect x="830" y="440" width="140" height="94" fill="#fff" stroke="#000"/><text x="900" y="456" text-anchor="middle" font-weight="700">ChatHistory</text><line x1="830" y1="463" x2="970" y2="463" stroke="#000"/>
    <text x="838" y="479">query</text><text x="838" y="494">response</text><text x="838" y="509">intent</text><text x="838" y="524">dateTime</text>

  <!-- ===== association names (italic, at line midpoints) ===== -->
  <g font-size="10" font-style="italic" text-anchor="middle">
    <text x="472" y="378">about</text><text x="551" y="378">has</text><text x="630" y="378">knows</text><text x="709" y="378">has</text>
    <text x="788" y="378">owns</text><text x="867" y="373">converses via</text><text x="946" y="378">has</text><text x="1026" y="378">receives</text>
    <text x="1105" y="373">summarized in</text><text x="1184" y="378">takes</text><text x="1262" y="378">follows</text>
    <text x="1532" y="578">records</text><text x="1690" y="588">records</text><text x="505" y="574">matches</text>
    <text x="470" y="176">cares for</text><text x="140" y="300">writes</text><text x="1592" y="167">handles</text>
  </g>

  <!-- ===== multiplicity labels ===== -->
  <g font-size="9" text-anchor="middle">
    <!-- patient-side of fan (spread at y=342) -->
    <text x="705" y="342">1</text><text x="733" y="342">1</text><text x="761" y="342">1</text><text x="790" y="342">1</text>
    <text x="818" y="342">1</text><text x="847" y="342">1</text><text x="875" y="342">1</text><text x="904" y="342">1</text>
    <text x="932" y="342">0..1</text><text x="960" y="342">1</text><text x="989" y="342">1</text>
    <!-- box-side of fan (just above each box) -->
    <text x="128" y="434">0..*</text><text x="286" y="434">0..*</text><text x="444" y="434">0..*</text><text x="602" y="434">0..*</text>
    <text x="760" y="434">0..*</text><text x="918" y="434">0..*</text><text x="1076" y="434">0..*</text><text x="1234" y="434">0..*</text>
    <text x="1392" y="434">0..*</text><text x="1550" y="434">0..*</text><text x="1708" y="434">0..*</text>
    <!-- chains -->
    <text x="1548" y="548">1</text><text x="1548" y="612">0..*</text>
    <text x="1706" y="562">1</text><text x="1706" y="612">0..*</text>
    <!-- matches -->
    <text x="600" y="530">0..*</text><text x="410" y="530">0..1</text>
    <!-- cares for -->
    <text x="250" y="140">0..*</text><text x="700" y="238">0..*</text>
    <!-- writes -->
    <text x="128" y="172">1</text><text x="128" y="420">0..*</text>
    <!-- handles -->
    <text x="1580" y="150">0..1</text><text x="1580" y="192">0..*</text>
  </g>
</svg>

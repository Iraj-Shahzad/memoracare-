    <rect x="1146" y="440" width="140" height="94" fill="#fff" stroke="#000"/><text x="1216" y="456" text-anchor="middle" font-weight="700">Alert</text><line x1="1146" y1="463" x2="1286" y2="463" stroke="#000"/>
    <text x="1154" y="479">type</text><text x="1154" y="494">severity</text><text x="1154" y="509">message</text><text x="1154" y="524">isResolved</text>
    <!-- Report -->
    <rect x="1304" y="440" width="140" height="80" fill="#fff" stroke="#000"/><text x="1374" y="456" text-anchor="middle" font-weight="700">Report</text><line x1="1304" y1="463" x2="1444" y2="463" stroke="#000"/>
    <text x="1312" y="479">type</text><text x="1312" y="494">period</text><text x="1312" y="509">format</text>
    <!-- Medication -->
    <rect x="1462" y="440" width="140" height="94" fill="#fff" stroke="#000"/><text x="1532" y="456" text-anchor="middle" font-weight="700">Medication</text><line x1="1462" y1="463" x2="1602" y2="463" stroke="#000"/>
    <text x="1470" y="479">name</text><text x="1470" y="494">dosage</text><text x="1470" y="509">frequency</text><text x="1470" y="524">times</text>
    <!-- Routine -->
    <rect x="1620" y="440" width="140" height="110" fill="#fff" stroke="#000"/><text x="1690" y="456" text-anchor="middle" font-weight="700">Routine</text><line x1="1620" y1="463" x2="1760" y2="463" stroke="#000"/>
    <text x="1628" y="479">activityName</text><text x="1628" y="494">startTime</text><text x="1628" y="509">endTime</text><text x="1628" y="524">days</text><text x="1628" y="539">priority</text>
    <!-- MedicationLog -->
    <rect x="1462" y="620" width="140" height="80" fill="#fff" stroke="#000"/><text x="1532" y="636" text-anchor="middle" font-weight="700" font-size="10">MedicationLog</text><line x1="1462" y1="643" x2="1602" y2="643" stroke="#000"/>
    <text x="1470" y="659">status</text><text x="1470" y="674">scheduledTime</text><text x="1470" y="689">takenAt</text>
    <!-- RoutineLog -->
    <rect x="1620" y="620" width="140" height="80" fill="#fff" stroke="#000"/><text x="1690" y="636" text-anchor="middle" font-weight="700">RoutineLog</text><line x1="1620" y1="643" x2="1760" y2="643" stroke="#000"/>
    <text x="1628" y="659">status</text><text x="1628" y="674">scheduledDate</text><text x="1628" y="689">completedAt</text>

<svg viewBox="0 0 1120 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1120" height="600" fill="#ffffff"/>
  <text x="40" y="30" font-size="19" font-weight="700">MemoryCare - Domain Model</text>

  <!-- ===== association lines (center-to-center; boxes cover inner parts) ===== -->
  <g stroke="#555" stroke-width="1.2">
    <line x1="280" y1="273" x2="620" y2="277"/>
    <line x1="620" y1="277" x2="960" y2="157"/>
    <line x1="620" y1="277" x2="980" y2="317"/>
    <line x1="620" y1="277" x2="230" y2="440"/>
    <line x1="620" y1="277" x2="440" y2="512"/>
    <line x1="620" y1="277" x2="680" y2="510"/>
    <line x1="620" y1="277" x2="960" y2="477"/>
  </g>

  <!-- ===== generalization tree (shared hollow triangle) ===== -->
  <g stroke="#000" stroke-width="1.3" fill="none">
    <line x1="620" y1="134" x2="620" y2="190"/>
    <line x1="620" y1="230" x2="620" y2="190"/>
    <line x1="280" y1="273" x2="620" y2="190"/>
  </g>
  <path d="M612,134 L628,134 L620,120 Z" fill="#fff" stroke="#000" stroke-width="1.3"/>

  <!-- ===== boxes ===== -->
  <g font-size="11">
    <!-- User -->
    <rect x="540" y="40" width="160" height="94" fill="#fff" stroke="#000"/><text x="620" y="56" text-anchor="middle" font-weight="700">User</text><line x1="540" y1="63" x2="700" y2="63" stroke="#000"/>
    <text x="548" y="79">name</text><text x="548" y="94">email</text><text x="548" y="109">phone</text><text x="548" y="124">role</text>
    <!-- Patient -->
    <rect x="540" y="230" width="160" height="94" fill="#fff" stroke="#000"/><text x="620" y="246" text-anchor="middle" font-weight="700">Patient</text><line x1="540" y1="253" x2="700" y2="253" stroke="#000"/>
    <text x="548" y="269">dateOfBirth</text><text x="548" y="284">gender</text><text x="548" y="299">diagnosis</text><text x="548" y="314">city</text>
    <!-- Caregiver -->
    <rect x="200" y="245" width="160" height="56" fill="#fff" stroke="#000"/><text x="280" y="261" text-anchor="middle" font-weight="700">Caregiver</text><line x1="200" y1="268" x2="360" y2="268" stroke="#000"/>
    <text x="208" y="284">specialization</text>
    <!-- Medication -->
    <rect x="880" y="110" width="160" height="94" fill="#fff" stroke="#000"/><text x="960" y="126" text-anchor="middle" font-weight="700">Medication</text><line x1="880" y1="133" x2="1040" y2="133" stroke="#000"/>
    <text x="888" y="149">name</text><text x="888" y="164">dosage</text><text x="888" y="179">frequency</text><text x="888" y="194">times</text>
    <!-- Routine -->
    <rect x="900" y="270" width="160" height="94" fill="#fff" stroke="#000"/><text x="980" y="286" text-anchor="middle" font-weight="700">Routine</text><line x1="900" y1="293" x2="1060" y2="293" stroke="#000"/>
    <text x="908" y="309">activityName</text><text x="908" y="324">startTime</text><text x="908" y="339">endTime</text><text x="908" y="354">priority</text>
    <!-- Alert -->
    <rect x="880" y="430" width="160" height="94" fill="#fff" stroke="#000"/><text x="960" y="446" text-anchor="middle" font-weight="700">Alert</text><line x1="880" y1="453" x2="1040" y2="453" stroke="#000"/>
    <text x="888" y="469">type</text><text x="888" y="484">severity</text><text x="888" y="499">message</text><text x="888" y="514">isResolved</text>
    <!-- ChatHistory -->
    <rect x="600" y="470" width="160" height="80" fill="#fff" stroke="#000"/><text x="680" y="486" text-anchor="middle" font-weight="700">ChatHistory</text><line x1="600" y1="493" x2="760" y2="493" stroke="#000"/>
    <text x="608" y="509">query</text><text x="608" y="524">response</text><text x="608" y="539">intent</text>
    <!-- Memory -->
    <rect x="360" y="465" width="160" height="94" fill="#fff" stroke="#000"/><text x="440" y="481" text-anchor="middle" font-weight="700">Memory</text><line x1="360" y1="488" x2="520" y2="488" stroke="#000"/>
    <text x="368" y="504">title</text><text x="368" y="519">description</text><text x="368" y="534">date</text><text x="368" y="549">location</text>
    <!-- KnownFace -->
    <rect x="150" y="400" width="160" height="80" fill="#fff" stroke="#000"/><text x="230" y="416" text-anchor="middle" font-weight="700">KnownFace</text><line x1="150" y1="423" x2="310" y2="423" stroke="#000"/>
    <text x="158" y="439">name</text><text x="158" y="454">relationship</text><text x="158" y="469">photo</text>
  </g>

  <!-- ===== association names (italic) ===== -->
  <g font-size="10.5" font-style="italic" text-anchor="middle">
    <text x="450" y="291">cares for</text>
    <text x="792" y="210">takes</text>
    <text x="800" y="311">follows</text>
    <text x="420" y="352">knows</text>
    <text x="512" y="398">owns</text>
    <text x="655" y="400">converses via</text>
    <text x="800" y="372">triggers</text>
  </g>

  <!-- ===== multiplicities ===== -->
  <g font-size="9" text-anchor="middle">
    <!-- cares for -->
    <text x="388" y="266">0..*</text><text x="522" y="266">0..*</text>
    <!-- takes -->
    <text x="686" y="250">1</text><text x="892" y="178">0..*</text>
    <!-- follows -->
    <text x="700" y="288">1</text><text x="908" y="309">0..*</text>
    <!-- knows -->
    <text x="548" y="318">1</text><text x="318" y="406">0..*</text>
    <!-- owns -->
    <text x="588" y="332">1</text><text x="470" y="462">0..*</text>
    <!-- converses via -->
    <text x="632" y="345">1</text><text x="672" y="462">0..*</text>
    <!-- triggers -->
    <text x="700" y="322">1</text><text x="890" y="438">0..*</text>
  </g>
</svg>

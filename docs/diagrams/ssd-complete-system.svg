<svg xmlns="http://www.w3.org/2000/svg" viewBox="10 0 1680 1385" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="filled" markerWidth="26" markerHeight="20" refX="20" refY="8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L20,8 L0,16 z" fill="black"/>
    </marker>
    <marker id="open" markerWidth="30" markerHeight="24" refX="20" refY="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M22,2 L2,10 L22,18" fill="none" stroke="black" stroke-width="2.5"/>
    </marker>
  </defs>
  <rect x="10" y="0" width="1680" height="1385" fill="white"/>
  <g stroke="black" stroke-width="2.5" fill="none">
    <!-- enclosing interaction frame -->
    <rect x="30" y="20" width="1640" height="1325"/>

    <!-- lifelines: Patient, Caregiver, :System -->
    <line x1="140" y1="226" x2="140" y2="1325" stroke-dasharray="6 5"/>
    <line x1="480" y1="226" x2="480" y2="1325" stroke-dasharray="6 5"/>
    <line x1="1350" y1="136" x2="1350" y2="1325" stroke-dasharray="6 5"/>

    <!-- interaction frame pentagon tab -->
    <path d="M30,20 L340,20 L340,50 L330,62 L30,62 Z" fill="white"/>

    <!-- Patient actor -->
    <circle cx="140" cy="100" r="18" fill="white"/>
    <line x1="140" y1="118" x2="140" y2="162"/>
    <line x1="108" y1="140" x2="172" y2="140"/>
    <line x1="140" y1="162" x2="118" y2="190"/>
    <line x1="140" y1="162" x2="162" y2="190"/>

    <!-- Caregiver actor -->
    <circle cx="480" cy="100" r="18" fill="white"/>
    <line x1="480" y1="118" x2="480" y2="162"/>
    <line x1="448" y1="140" x2="512" y2="140"/>
    <line x1="480" y1="162" x2="458" y2="190"/>
    <line x1="480" y1="162" x2="502" y2="190"/>

    <!-- :System black box -->
    <rect x="1220" y="80" width="260" height="56" fill="white"/>

    <!-- combined fragments -->
    <rect x="90" y="366" width="1360" height="113" fill="none"/>
    <path d="M90,366 L190,366 L190,382 L178,398 L90,398 Z" fill="white"/>
    <rect x="90" y="624" width="1360" height="113" fill="none"/>
    <path d="M90,624 L190,624 L190,640 L178,656 L90,656 Z" fill="white"/>
    <rect x="90" y="766" width="1360" height="185" fill="none"/>
    <path d="M90,766 L190,766 L190,782 L178,798 L90,798 Z" fill="white"/>
    <line x1="90" y1="881" x2="1450" y2="881" stroke-dasharray="6 5"/>

    <!-- activation bars -->
    <rect x="1340" y="250" width="20" height="29" fill="white"/>
    <rect x="1340" y="308" width="20" height="29" fill="white"/>
    <rect x="1340" y="428" width="20" height="29" fill="white"/>
    <rect x="1340" y="508" width="20" height="29" fill="white"/>
    <rect x="1340" y="566" width="20" height="29" fill="white"/>
    <rect x="1340" y="686" width="20" height="29" fill="white"/>
    <rect x="1340" y="828" width="20" height="101" fill="white"/>
    <rect x="1340" y="980" width="20" height="29" fill="white"/>
    <rect x="1340" y="1038" width="20" height="29" fill="white"/>
    <rect x="1340" y="1096" width="20" height="29" fill="white"/>
    <rect x="1340" y="1154" width="20" height="29" fill="white"/>
    <rect x="1340" y="1212" width="20" height="29" fill="white"/>
    <rect x="1340" y="1270" width="20" height="29" fill="white"/>

    <!-- Patient messages -->
    <line x1="140" y1="250" x2="1340" y2="250" marker-end="url(#filled)"/>
    <line x1="1340" y1="279" x2="140" y2="279" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <line x1="140" y1="308" x2="1340" y2="308" marker-end="url(#filled)"/>
    <line x1="1340" y1="337" x2="140" y2="337" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <line x1="140" y1="428" x2="1340" y2="428" marker-end="url(#filled)"/>
    <line x1="1340" y1="457" x2="140" y2="457" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <line x1="140" y1="508" x2="1340" y2="508" marker-end="url(#filled)"/>
    <line x1="1340" y1="537" x2="140" y2="537" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <line x1="140" y1="566" x2="1340" y2="566" marker-end="url(#filled)"/>
    <line x1="1340" y1="595" x2="140" y2="595" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <line x1="140" y1="686" x2="1340" y2="686" marker-end="url(#filled)"/>
    <line x1="1340" y1="715" x2="140" y2="715" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <line x1="140" y1="828" x2="1340" y2="828" marker-end="url(#filled)"/>
    <line x1="1340" y1="857" x2="140" y2="857" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <line x1="1340" y1="929" x2="140" y2="929" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <line x1="140" y1="980" x2="1340" y2="980" marker-end="url(#filled)"/>
    <line x1="1340" y1="1009" x2="140" y2="1009" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <line x1="140" y1="1038" x2="1340" y2="1038" marker-end="url(#filled)"/>
    <line x1="1340" y1="1067" x2="140" y2="1067" stroke-dasharray="6 4" marker-end="url(#open)"/>

    <!-- Caregiver messages -->
    <line x1="480" y1="1096" x2="1340" y2="1096" marker-end="url(#filled)"/>
    <line x1="1340" y1="1125" x2="480" y2="1125" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <line x1="480" y1="1154" x2="1340" y2="1154" marker-end="url(#filled)"/>
    <line x1="1340" y1="1183" x2="480" y2="1183" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <line x1="480" y1="1212" x2="1340" y2="1212" marker-end="url(#filled)"/>
    <line x1="1340" y1="1241" x2="480" y2="1241" stroke-dasharray="6 4" marker-end="url(#open)"/>
    <line x1="480" y1="1270" x2="1340" y2="1270" marker-end="url(#filled)"/>
    <line x1="1340" y1="1299" x2="480" y2="1299" stroke-dasharray="6 4" marker-end="url(#open)"/>
  </g>

  <!-- headings, operators and guards -->
  <g fill="black">
    <text x="42" y="52" font-size="24" font-weight="bold">sd  Complete System</text>
    <text x="140" y="214" font-size="26" text-anchor="middle" font-weight="bold">Patient</text>
    <text x="480" y="214" font-size="26" text-anchor="middle" font-weight="bold">Caregiver</text>
    <text x="1350" y="116" font-size="26" text-anchor="middle" font-weight="bold">:System</text>
    <text x="140" y="389" font-size="22" text-anchor="middle" font-weight="bold">loop</text>
    <text x="140" y="647" font-size="22" text-anchor="middle" font-weight="bold">loop</text>
    <text x="140" y="789" font-size="22" text-anchor="middle" font-weight="bold">alt</text>
    <text x="210" y="389" font-size="22" font-style="italic">[for each due dose]</text>
    <text x="210" y="647" font-size="22" font-style="italic">[while chatting]</text>
    <text x="210" y="789" font-size="22" font-style="italic">[face recognized]</text>
    <text x="210" y="903" font-size="22" font-style="italic">[unknown]</text>
  </g>

  <!-- Patient message labels (white backing keeps them legible where they cross the Caregiver lifeline) -->
  <g fill="black" font-size="24" text-anchor="middle">
    <rect x="586" y="224" width="308" height="24" fill="white"/><text x="740" y="242">login(email, password)</text>
    <rect x="673" y="253" width="134" height="24" fill="white"/><text x="740" y="271" font-style="italic">authToken</text>
    <rect x="519" y="282" width="442" height="24" fill="white"/><text x="740" y="300">viewTodaysMedications(patientId)</text>
    <rect x="640" y="311" width="200" height="24" fill="white"/><text x="740" y="329" font-style="italic">medicationList</text>
    <rect x="559" y="402" width="362" height="24" fill="white"/><text x="740" y="420">markMedicationTaken(medId)</text>
    <rect x="653" y="431" width="174" height="24" fill="white"/><text x="740" y="449" font-style="italic">confirmation</text>
    <rect x="579" y="482" width="322" height="24" fill="white"/><text x="740" y="500">viewRoutines(patientId)</text>
    <rect x="660" y="511" width="160" height="24" fill="white"/><text x="740" y="529" font-style="italic">routineList</text>
    <rect x="559" y="540" width="362" height="24" fill="white"/><text x="740" y="558">completeRoutine(routineId)</text>
    <rect x="653" y="569" width="174" height="24" fill="white"/><text x="740" y="587" font-style="italic">confirmation</text>
    <rect x="441" y="660" width="598" height="24" fill="white"/><text x="740" y="678">sendMessage(patientId, message, mode, lang)</text>
    <rect x="582" y="689" width="316" height="24" fill="white"/><text x="740" y="707" font-style="italic">reply(text, intent, source)</text>
    <rect x="539" y="802" width="402" height="24" fill="white"/><text x="740" y="820">captureFace(patientId, image)</text>
    <rect x="452" y="831" width="576" height="24" fill="white"/><text x="740" y="849" font-style="italic">personInfo(name, relationship, confidence)</text>
    <rect x="646" y="903" width="188" height="24" fill="white"/><text x="740" y="921" font-style="italic">unknownPerson</text>
    <rect x="579" y="954" width="322" height="24" fill="white"/><text x="740" y="972">viewMemories(patientId)</text>
    <rect x="667" y="983" width="146" height="24" fill="white"/><text x="740" y="1001" font-style="italic">memoryList</text>
    <rect x="472" y="1012" width="536" height="24" fill="white"/><text x="740" y="1030">generateReport(patientId, type, period)</text>
    <rect x="667" y="1041" width="146" height="24" fill="white"/><text x="740" y="1059" font-style="italic">reportFile</text>
  </g>

  <!-- Caregiver message labels -->
  <g fill="black" font-size="24" text-anchor="middle">
    <rect x="682" y="1070" width="456" height="24" fill="white"/><text x="910" y="1088">addMedication(patientId, details)</text>
    <rect x="823" y="1099" width="174" height="24" fill="white"/><text x="910" y="1117" font-style="italic">confirmation</text>
    <rect x="609" y="1128" width="602" height="24" fill="white"/><text x="910" y="1146">enrollKnownFace(patientId, name, descriptor)</text>
    <rect x="823" y="1157" width="174" height="24" fill="white"/><text x="910" y="1175" font-style="italic">confirmation</text>
    <rect x="749" y="1186" width="322" height="24" fill="white"/><text x="910" y="1204">viewAlerts(caregiverId)</text>
    <rect x="843" y="1215" width="134" height="24" fill="white"/><text x="910" y="1233" font-style="italic">alertList</text>
    <rect x="763" y="1244" width="294" height="24" fill="white"/><text x="910" y="1262">resolveAlert(alertId)</text>
    <rect x="823" y="1273" width="174" height="24" fill="white"/><text x="910" y="1291" font-style="italic">confirmation</text>
  </g>
</svg>
